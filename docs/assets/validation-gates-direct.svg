<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
<title id="title">Chaîne de validation Fedora 44 Golden Workstation</title>
<desc id="desc">Gate 1 sous WSL2, Gate 2 sous VirtualBox, installation bare-metal, APPLY protégé, Gate 3 sur la machine réelle, puis Golden release PASS.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f6f98"/></marker>
  <style>
    text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0d1b44}
    .title{font-size:34px;font-weight:800}
    .kicker{font-size:18px;font-weight:700;fill:#4f6f98}
    .head{font-size:19px;font-weight:800}
    .sub{font-size:14px;font-weight:500;fill:#405779}
    .badge{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>
<rect width="1400" height="300" fill="#fff"/>
<text x="35" y="48" class="title">Validation complète</text>
<text x="35" y="78" class="kicker">Prévalider → installer → certifier sur le vrai matériel</text>

<g transform="translate(30 112)">
  <rect width="175" height="128" rx="18" fill="#eaf4ff" stroke="#7bb8ed"/>
  <circle cx="30" cy="30" r="20" fill="#2385d8"/><text x="30" y="31" class="badge">G1</text>
  <text x="59" y="34" class="head">Gate 1</text>
  <text x="20" y="76" class="sub">Fedora 44 / WSL2</text>
  <text x="20" y="100" class="sub">Système + contrats</text>
</g>
<line x1="218" y1="176" x2="248" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(260 112)">
  <rect width="180" height="128" rx="18" fill="#f0ecff" stroke="#ab9bed"/>
  <circle cx="30" cy="30" r="20" fill="#6d63db"/><text x="30" y="31" class="badge">G2</text>
  <text x="59" y="34" class="head">Gate 2</text>
  <text x="20" y="76" class="sub">GNOME / VirtualBox</text>
  <text x="20" y="100" class="sub">Desktop + UX</text>
</g>
<line x1="453" y1="176" x2="483" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(495 112)">
  <rect width="195" height="128" rx="18" fill="#edf8f2" stroke="#75c59a"/>
  <circle cx="30" cy="30" r="20" fill="#20a46f"/><text x="30" y="31" class="badge">3</text>
  <text x="59" y="34" class="head">Installation</text>
  <text x="20" y="76" class="sub">Fedora 44 bare-metal</text>
  <text x="20" y="100" class="sub">machine cible</text>
</g>
<line x1="703" y1="176" x2="733" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(745 112)">
  <rect width="205" height="128" rx="18" fill="#fff4dc" stroke="#f0b34b"/>
  <circle cx="30" cy="30" r="20" fill="#f59e0b"/><text x="30" y="31" class="badge">4</text>
  <text x="59" y="34" class="head">APPLY protégé</text>
  <text x="20" y="76" class="sub">Baseline · dry-run</text>
  <text x="20" y="100" class="sub">backup · convergence</text>
</g>
<line x1="963" y1="176" x2="993" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(1005 112)">
  <rect width="175" height="128" rx="18" fill="#ffeceb" stroke="#ee8c86"/>
  <circle cx="30" cy="30" r="20" fill="#e65b52"/><text x="30" y="31" class="badge">G3</text>
  <text x="59" y="34" class="head">Gate 3</text>
  <text x="20" y="76" class="sub">Preuves physiques</text>
  <text x="20" y="100" class="sub">runtime réel</text>
</g>
<line x1="1193" y1="176" x2="1223" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(1235 112)">
  <rect width="135" height="128" rx="18" fill="#eaf9f1" stroke="#67c998"/>
  <circle cx="30" cy="30" r="20" fill="#20a46f"/>
  <path d="M21 30 l7 7 13 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="77" class="head">Golden</text>
  <text x="20" y="102" class="head">PASS</text>
</g>
</svg>