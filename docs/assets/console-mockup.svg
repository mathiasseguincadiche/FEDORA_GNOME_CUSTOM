  <text x="720" y="410" font-size="11" fill="#94A3B8">à faire sur le matériel</text>
  <rect x="272" y="468" width="636" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="590" y="491" text-anchor="middle" font-size="13" fill="#E2E8F0">Garde-fous : essai à blanc · sauvegarde vérifiée · confirmation explicite · PC physique</text>
  <rect x="272" y="524" width="636" height="48" rx="8" fill="#1E293B" stroke="#64748B"/>
  <text x="292" y="554" font-size="16" font-weight="bold" fill="#F8FAFC">$ ./control.sh</text>
  <rect x="420" y="540" width="9" height="18" fill="#F8FAFC"/>
  <text x="480" y="660" text-anchor="middle" font-size="14" fill="#94A3B8">Maquette de l'interface de contrôle, pas une capture réelle. Statuts conformes à l'état réel au 2026-11-06.</text>
