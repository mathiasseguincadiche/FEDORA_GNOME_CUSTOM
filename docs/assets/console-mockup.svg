<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Arial, sans-serif">
  <title>Maquette de l'interface de contrôle du poste</title>
  <desc>Console control.sh en thème sombre : barre de titre, menu des dix domaines, tableau de bord à six cartes reprenant l'état réel, rappel des garde-fous et ligne de commande. Maquette illustrative, pas une capture réelle.</desc>
  <rect width="960" height="680" fill="#0F172A"/>
