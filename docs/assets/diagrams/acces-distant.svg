<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" width="1320" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Accès distant : tablette, Tailscale et réveil</title>
  <desc id="desc">La tablette Android (Moonlight, client SSH, Tailscale) atteint le PC Fedora par le tunnel privé Tailscale, sans port ouvert sur Internet : SSH par clés uniquement, Sunshine s&#x27;il est activé, GNOME Remote Desktop en repli configuré à la main. Pour réveiller le PC éteint, la tablette s&#x27;adresse au relais toujours allumé sur le réseau local, qui envoie le Magic Packet. Le profil est désactivé par défaut.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
  <rect width="1320" height="480" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1320" height="7" fill="#346AC4"/>
  <text x="40" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#1A2C43">Accès distant : tablette, Tailscale et réveil</text>
  <line x1="300.0" y1="165.0" x2="380.0" y2="165.0" stroke="#547BB4" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="630.0" y1="165.0" x2="840.0" y2="165.0" stroke="#547BB4" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="505.0" y1="220.0" x2="505.0" y2="330.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630.0" y1="331.6" x2="840.6" y2="250.0" stroke="#547BB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="40" y="110" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="170.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Tablette Android</text>
  <text x="170.0" y="174.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Moonlight · client SSH</text>
  <text x="170.0" y="198.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Tailscale</text>
  <rect x="380" y="110" width="250" height="110" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="505.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Tailscale</text>
  <text x="505.0" y="174.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">tunnel privé chiffré</text>
  <text x="505.0" y="198.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">aucun port sur Internet</text>
  <rect x="840" y="80" width="440" height="170" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="1060.0" y="126.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">PC Fedora</text>
  <text x="1060.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">sshd : clés uniquement</text>
  <text x="1060.0" y="174.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Sunshine, si activé</text>
  <text x="1060.0" y="198.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">repli manuel : GNOME Remote Desktop</text>
  <text x="1060.0" y="222.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">zone firewalld fgc-tailnet</text>
  <rect x="380" y="330" width="250" height="100" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="505.0" y="377.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Relais permanent</text>
  <text x="505.0" y="401.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">sur le réseau local</text>
  <rect x="40" y="330" width="280" height="100" rx="14" fill="#FFFFFF" stroke="#7C8A9C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="180.0" y="365.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Profil inactif</text>
  <text x="180.0" y="389.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">REMOTE_ENABLE=false</text>
  <text x="180.0" y="413.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Gate 3 à faire</text>
  <rect x="661.2" y="154.0" width="147.7" height="20" rx="4" fill="#FFFFFF"/>
  <text x="735.0" y="169.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">SSH · flux vidéo</text>
  <rect x="473.6" y="264.0" width="62.9" height="20" rx="4" fill="#FFFFFF"/>
  <text x="505.0" y="279.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">réveil</text>
  <rect x="653.0" y="279.8" width="164.6" height="20" rx="4" fill="#FFFFFF"/>
  <text x="735.3" y="294.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">Magic Packet (LAN)</text>
</svg>
