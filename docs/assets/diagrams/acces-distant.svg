<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" width="1320" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Accès distant : tablette, Tailscale et réveil</title>
  <desc id="desc">La tablette Android (Moonlight, client SSH, Tailscale) atteint le PC Fedora par le tunnel privé Tailscale, sans port ouvert sur Internet : SSH par clés uniquement, Sunshine s&#x27;il est activé, GNOME Remote Desktop en repli configuré à la main. Pour réveiller le PC éteint, la tablette s&#x27;adresse au relais toujours allumé sur le réseau local, qui envoie le Magic Packet. Le profil est désactivé par défaut.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1320" height="480" fill="#FFFFFF"/>
  <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Accès distant : tablette, Tailscale et réveil</text>
  <line x1="300.0" y1="165.0" x2="380.0" y2="165.0" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="630.0" y1="165.0" x2="840.0" y2="165.0" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="505.0" y1="220.0" x2="505.0" y2="330.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630.0" y1="331.6" x2="840.6" y2="250.0" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="40" y="110" width="260" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="170.0" y="151.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Tablette Android</text>
  <text x="170.0" y="170.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Moonlight · client SSH</text>
  <text x="170.0" y="189.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Tailscale</text>
  <rect x="380" y="110" width="250" height="110" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="505.0" y="151.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Tailscale</text>
  <text x="505.0" y="170.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">tunnel privé chiffré</text>
  <text x="505.0" y="189.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">aucun port sur Internet</text>
  <rect x="840" y="80" width="440" height="170" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="1060.0" y="132.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">PC Fedora</text>
  <text x="1060.0" y="151.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">sshd : clés uniquement</text>
  <text x="1060.0" y="170.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Sunshine, si activé</text>
  <text x="1060.0" y="189.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">repli manuel : GNOME Remote Desktop</text>
  <text x="1060.0" y="208.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">zone firewalld fgc-tailnet</text>
  <rect x="380" y="330" width="250" height="100" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="505.0" y="376.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Relais toujours allumé</text>
  <text x="505.0" y="395.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">sur le réseau local</text>
  <rect x="40" y="330" width="260" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="170.0" y="366.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Profil désactivé par défaut</text>
  <text x="170.0" y="385.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">REMOTE_ENABLE=false</text>
  <text x="170.0" y="404.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Gate 3 à faire</text>
  <rect x="675.2" y="154.0" width="119.5" height="20" rx="4" fill="#FFFFFF"/>
  <text x="735.0" y="169.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#0F172A">SSH · flux vidéo</text>
  <rect x="478.8" y="264.0" width="52.3" height="20" rx="4" fill="#FFFFFF"/>
  <text x="505.0" y="279.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#0F172A">réveil</text>
  <rect x="668.8" y="279.8" width="133.0" height="20" rx="4" fill="#FFFFFF"/>
  <text x="735.3" y="294.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#0F172A">Magic Packet (LAN)</text>
</svg>
