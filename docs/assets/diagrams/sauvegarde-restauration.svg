<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" width="1320" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Sauvegarde et restauration</title>
  <desc id="desc">Trois familles de sources vont dans un dépôt Borg sur le SSD externe XS1000 (ext4, non chiffré) : les données de /data (Documents, Projets, IA/Openclaw), les dossiers personnels (Bureau, Images, Vidéos, Musique, ~/Development) et les réglages (.config, .mozilla, .var/app, .local/share, configuration de l&#x27;hôte et du projet). La sauvegarde pré-APPLY est validée par borg check --verify-data et une restauration canari. Une restauration se fait d&#x27;abord dans ~/Restores, puis on inspecte et on copie à la main. Hors Borg : Téléchargements, ISO, Jeux et les VM, exportées manuellement ; le système est reconstruit depuis le dépôt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
  <rect width="1320" height="680" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1320" height="7" fill="#346AC4"/>
  <text x="40" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#1A2C43">Sauvegarde et restauration</text>
  <rect x="40" y="80" width="420" height="420" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="60" y="113" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2959B4">Sources sauvegardées</text>
  <line x1="398.0" y1="212.0" x2="520.0" y2="247.4" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440.0" y1="284.0" x2="520.0" y2="284.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440.0" y1="360.5" x2="520.0" y2="336.4" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820.0" y1="242.0" x2="973.1" y2="192.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820.0" y1="289.0" x2="960.0" y2="289.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120.0" y1="332.0" x2="1120.0" y2="392.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="126" width="380" height="86" rx="14" fill="#E8F6EF" stroke="#198263" stroke-width="1.8"/>
  <text x="250.0" y="166.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Données de /data</text>
  <text x="250.0" y="190.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Documents · Projets · IA/Openclaw</text>
  <rect x="60" y="236" width="380" height="96" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="250.0" y="269.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Dossiers personnels</text>
  <text x="250.0" y="293.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Bureau · Images · Vidéos · Musique</text>
  <text x="250.0" y="317.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">~/Development</text>
  <rect x="60" y="356" width="380" height="124" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="250.0" y="391.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Réglages</text>
  <text x="250.0" y="415.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">.config · .mozilla · .var/app</text>
  <text x="250.0" y="439.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">.local/share</text>
  <text x="250.0" y="463.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">configuration de l&#x27;hôte et du projet</text>
  <rect x="520" y="236" width="300" height="110" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="670.0" y="276.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Dépôt Borg</text>
  <text x="670.0" y="300.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">SSD externe Kingston XS1000</text>
  <text x="670.0" y="324.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">ext4 · sans chiffrement</text>
  <rect x="960" y="96" width="320" height="96" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="1120.0" y="129.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Contrôles de validation</text>
  <text x="1120.0" y="153.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">borg check --verify-data</text>
  <text x="1120.0" y="177.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">restauration canari</text>
  <rect x="960" y="246" width="320" height="86" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="1120.0" y="286.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Restauration en staging</text>
  <text x="1120.0" y="310.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">~/Restores/fedora-gnome-custom</text>
  <rect x="960" y="392" width="320" height="86" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="1120.0" y="432.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Inspection et copie</text>
  <text x="1120.0" y="456.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">sans écrasement en place</text>
  <rect x="40" y="540" width="600" height="110" rx="14" fill="#FFFFFF" stroke="#7C8A9C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="340.0" y="580.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">Hors Borg</text>
  <text x="340.0" y="604.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Téléchargements · ISO · Jeux</text>
  <text x="340.0" y="628.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">disques, XML et NVRAM des VM : export manuel</text>
  <rect x="680" y="540" width="600" height="110" rx="14" fill="#FFFFFF" stroke="#7C8A9C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="980.0" y="592.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">T705 nº1 : système</text>
  <text x="980.0" y="616.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">reconstruit depuis le dépôt, pas restauré</text>
  <rect x="852.4" y="206.0" width="88.3" height="20" rx="4" fill="#FFFFFF"/>
  <text x="896.5" y="221.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">pré-APPLY</text>
  <rect x="845.8" y="278.0" width="88.3" height="20" rx="4" fill="#FFFFFF"/>
  <text x="890.0" y="293.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">restaurer</text>
</svg>
