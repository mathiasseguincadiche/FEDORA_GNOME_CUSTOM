<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Le centre de contrôle : une façade, des moteurs</title>
  <desc id="desc">L&#x27;opérateur passe par ./control.sh, une façade sans logique métier. Chaque domaine appelle son moteur : install (install.sh, dry-run et APPLY protégé), update (update-system.sh), kernel (kernel-lifecycle.sh et secours Fedora), backup (backup-now.sh, restore.sh), kvm (création Rocky DevOps et garde réseau), doctor (diagnostics en lecture seule), validate et cert (Live USB, Gate 3, certification), status et logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1160" height="700" fill="#FFFFFF"/>
  <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Le centre de contrôle : une façade, des moteurs</text>
  <rect x="620" y="70" width="500" height="610" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="636" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#334155">Domaines et moteurs appelés</text>
  <line x1="220.0" y1="335.0" x2="280.0" y2="335.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520.0" y1="335.0" x2="620.0" y2="335.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="300" width="180" height="70" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="130.0" y="340.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Opérateur</text>
  <rect x="280" y="275" width="240" height="120" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="400.0" y="321.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">./control.sh</text>
  <text x="400.0" y="340.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">façade mince</text>
  <text x="400.0" y="359.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">aucune logique métier</text>
  <rect x="640" y="110" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="135.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">install</text>
  <text x="870.0" y="154.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">install.sh : dry-run, APPLY protégé</text>
  <rect x="640" y="180" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="205.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">update</text>
  <text x="870.0" y="224.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">scripts/maintenance/update-system.sh</text>
  <rect x="640" y="250" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="275.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">kernel</text>
  <text x="870.0" y="294.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">kernel-lifecycle.sh · secours Fedora</text>
  <rect x="640" y="320" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="345.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">backup</text>
  <text x="870.0" y="364.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">backup-now.sh · restore.sh</text>
  <rect x="640" y="390" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="415.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">kvm</text>
  <text x="870.0" y="434.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Rocky DevOps · garde réseau</text>
  <rect x="640" y="460" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="485.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">doctor</text>
  <text x="870.0" y="504.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">diagnostics/*-doctor (lecture seule)</text>
  <rect x="640" y="530" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="555.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">validate · cert</text>
  <text x="870.0" y="574.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Live USB · Gate 3 · certification</text>
  <rect x="640" y="600" width="460" height="58" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="870.0" y="625.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">status · logs</text>
  <text x="870.0" y="644.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">état du poste et journaux</text>
</svg>
