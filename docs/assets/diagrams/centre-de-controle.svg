<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Le centre de contrôle : une façade, des moteurs</title>
  <desc id="desc">L&#x27;opérateur passe par ./control.sh, une façade sans logique métier. Chaque domaine appelle son moteur : install (install.sh, dry-run et APPLY protégé), update (update-system.sh), kernel (kernel-lifecycle.sh et secours Fedora), backup (backup-now.sh, restore.sh), kvm (création Rocky DevOps et garde réseau), doctor (diagnostics en lecture seule), validate et cert (Live USB, Gate 3, certification), status et logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
  <rect width="1160" height="700" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1160" height="7" fill="#346AC4"/>
  <text x="40" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#1A2C43">Le centre de contrôle : une façade, des moteurs</text>
  <rect x="620" y="70" width="500" height="610" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="640" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2959B4">Domaines et moteurs appelés</text>
  <line x1="220.0" y1="335.0" x2="280.0" y2="335.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520.0" y1="335.0" x2="620.0" y2="335.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="300" width="180" height="70" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="130.0" y="341.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">Opérateur</text>
  <rect x="280" y="275" width="240" height="120" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="400.0" y="322.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">./control.sh</text>
  <text x="400.0" y="341.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">façade mince</text>
  <text x="400.0" y="360.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">aucune logique métier</text>
  <rect x="640" y="110" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="136.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">install</text>
  <text x="870.0" y="155.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">install.sh : dry-run, APPLY protégé</text>
  <rect x="640" y="180" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="206.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">update</text>
  <text x="870.0" y="225.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">scripts/maintenance/update-system.sh</text>
  <rect x="640" y="250" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="276.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">kernel</text>
  <text x="870.0" y="295.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">kernel-lifecycle.sh · secours Fedora</text>
  <rect x="640" y="320" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="346.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">backup</text>
  <text x="870.0" y="365.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">backup-now.sh · restore.sh</text>
  <rect x="640" y="390" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="416.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">kvm</text>
  <text x="870.0" y="435.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">Rocky DevOps · garde réseau</text>
  <rect x="640" y="460" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="486.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">doctor</text>
  <text x="870.0" y="505.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">diagnostics/*-doctor (lecture seule)</text>
  <rect x="640" y="530" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="556.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">validate · cert</text>
  <text x="870.0" y="575.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">Live USB · Gate 3 · certification</text>
  <rect x="640" y="600" width="460" height="58" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="626.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">status · logs</text>
  <text x="870.0" y="645.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">état du poste et journaux</text>
</svg>
