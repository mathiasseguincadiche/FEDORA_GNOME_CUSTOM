  <text x="870.0" y="169.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">install.sh : dry-run, APPLY protégé</text>
  <rect x="640" y="192" width="460" height="76" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
