  <text x="870.0" y="661.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">Live USB · Gate 3 · certification</text>
  <rect x="640" y="684" width="460" height="76" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="870.0" y="719.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">status · logs</text>
  <text x="870.0" y="743.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">état du poste et journaux</text>
