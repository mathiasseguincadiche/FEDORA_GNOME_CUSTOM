<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 540" width="1320" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Le laboratoire Fedora/GNOME sur GitHub</title>
  <desc id="desc">Sur un runner GitHub jetable, sans toucher au PC : 1, une VM Fedora 45 démarre depuis l&#x27;image Cloud finale vérifiée ; 2, le dépôt est installé et la session GNOME 51 contrôlée ; 3, des données témoin survivent à un redémarrage ; 4, la VM est arrêtée puis sauvegardée à froid par Borg ; 5, l&#x27;original est supprimé et la VM restaurée redémarre ; 6, une image neuve est reconstruite et redémarrée ; 7, le rapport conserve preuves et journaux, et tout plantage fait échouer le laboratoire.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
  <rect width="1320" height="540" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1320" height="7" fill="#346AC4"/>
  <text x="40" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#1A2C43">Le laboratoire Fedora/GNOME sur GitHub</text>
  <rect x="30" y="70" width="1260" height="440" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="50" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2959B4">Runner GitHub jetable : aucune commande sur le PC</text>
  <line x1="330.0" y1="175.0" x2="370.0" y2="175.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0" y1="175.0" x2="680.0" y2="175.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950.0" y1="175.0" x2="990.0" y2="175.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1125.0" y1="230.0" x2="1125.0" y2="340.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990.0" y1="395.0" x2="950.0" y2="395.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680.0" y1="395.0" x2="640.0" y2="395.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="120" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="195.0" y="162.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">1. VM Fedora 45</text>
  <text x="195.0" y="181.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">image Cloud finale</text>
  <text x="195.0" y="200.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">signature et SHA-256</text>
  <rect x="370" y="120" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="505.0" y="162.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">2. Dépôt et session</text>
  <text x="505.0" y="181.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">GNOME 51 sous Wayland</text>
  <text x="505.0" y="200.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">natif ou six extensions</text>
  <rect x="680" y="120" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="815.0" y="162.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">3. Données témoin</text>
  <text x="815.0" y="181.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">redémarrage</text>
  <text x="815.0" y="200.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">persistance vérifiée</text>
  <rect x="990" y="120" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="1125.0" y="162.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">4. Arrêt propre</text>
  <text x="1125.0" y="181.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">Borg à froid : disque,</text>
  <text x="1125.0" y="200.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">UEFI et TPM</text>
  <rect x="990" y="340" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="1125.0" y="382.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">5. Restauration</text>
  <text x="1125.0" y="401.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">original supprimé,</text>
  <text x="1125.0" y="420.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">VM restaurée démarrée</text>
  <rect x="680" y="340" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="815.0" y="382.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">6. Reconstruction</text>
  <text x="815.0" y="401.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">image neuve</text>
  <text x="815.0" y="420.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">redémarrage et contrôles</text>
  <rect x="370" y="340" width="270" height="110" rx="14" fill="#E8F6EF" stroke="#198263" stroke-width="1.8"/>
  <text x="505.0" y="382.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1A2C43">7. Rapport</text>
  <text x="505.0" y="401.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">preuves et journaux</text>
  <text x="505.0" y="420.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2C43">plantage = échec</text>
</svg>
