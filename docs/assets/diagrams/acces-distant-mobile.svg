<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1358" width="360" height="1358" role="img" aria-labelledby="title desc">
  <title id="title">Accès distant</title>
  <desc id="desc">La tablette Android (Moonlight, client SSH, Tailscale) atteint le PC Fedora par le tunnel privé Tailscale, sans port ouvert sur Internet : SSH par clés uniquement, Sunshine s&#x27;il est activé, GNOME Remote Desktop en repli configuré à la main. Pour réveiller le PC éteint, la tablette s&#x27;adresse au relais toujours allumé sur le réseau local, qui envoie le Magic Packet. Le profil est désactivé par défaut.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
  <rect width="360" height="1358" fill="#F7F9FC"/>
  <rect x="0" y="0" width="360" height="7" fill="#346AC4"/>
  <text x="40" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#1A2C43">Accès distant</text>
  <rect x="10" y="90" width="340" height="525" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="30" y="123" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2959B4">01 · CONNEXION CHIFFRÉE</text>
  <rect x="10" y="651" width="340" height="544" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="30" y="684" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2959B4">02 · RÉVEIL SUR LE LAN</text>
  <line x1="180.0" y1="247.0" x2="180.0" y2="280.0" stroke="#547BB4" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="381.0" x2="180.0" y2="414.0" stroke="#547BB4" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="808.0" x2="180.0" y2="841.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="942.0" x2="180.0" y2="975.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="1053.0" x2="180.0" y2="1086.0" stroke="#547BB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="22" y="146" width="316" height="101" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="181.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Tablette Android</text>
  <text x="180.0" y="204.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Moonlight · client SSH</text>
  <text x="180.0" y="227.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Tailscale</text>
  <rect x="22" y="280" width="316" height="101" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="180.0" y="315.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Tailscale</text>
  <text x="180.0" y="338.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">tunnel privé chiffré</text>
  <text x="180.0" y="361.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">aucun port sur Internet</text>
  <rect x="22" y="414" width="316" height="170" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="180.0" y="449.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">PC Fedora</text>
  <text x="180.0" y="472.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">sshd : clés uniquement</text>
  <text x="180.0" y="495.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Sunshine, si activé</text>
  <text x="180.0" y="518.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">repli manuel : GNOME Remote</text>
  <text x="180.0" y="541.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Desktop</text>
  <text x="180.0" y="564.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">zone firewalld fgc-tailnet</text>
  <rect x="22" y="707" width="316" height="101" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="742.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Tablette Android</text>
  <text x="180.0" y="765.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Moonlight · client SSH</text>
  <text x="180.0" y="788.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Tailscale</text>
  <rect x="22" y="841" width="316" height="101" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="180.0" y="876.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Tailscale</text>
  <text x="180.0" y="899.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">tunnel privé chiffré</text>
  <text x="180.0" y="922.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">aucun port sur Internet</text>
  <rect x="22" y="975" width="316" height="78" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="1010.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Relais toujours allumé</text>
  <text x="180.0" y="1033.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">sur le réseau local</text>
  <rect x="22" y="1086" width="316" height="78" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="180.0" y="1121.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">PC Fedora</text>
  <text x="180.0" y="1144.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Magic Packet sur le réseau local</text>
  <rect x="22" y="1231" width="316" height="101" rx="14" fill="#FFFFFF" stroke="#7C8A9C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="180.0" y="1266.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Profil désactivé par défaut</text>
  <text x="180.0" y="1289.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">REMOTE_ENABLE=false</text>
  <text x="180.0" y="1312.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Gate 3 à faire</text>
</svg>
