<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1605" width="360" height="1605" role="img" aria-labelledby="title desc">
  <title id="title">Sauvegarde Borg</title>
  <desc id="desc">Trois familles de sources vont dans un dépôt Borg sur le SSD externe XS1000 (ext4, non chiffré) : les données de /data (Documents, Projets, IA/Openclaw), les dossiers personnels (Bureau, Images, Vidéos, Musique, ~/Development) et les réglages (.config, .mozilla, .var/app, .local/share, configuration de l&#x27;hôte et du projet). La sauvegarde pré-APPLY est validée par borg check --verify-data et une restauration canari. Une restauration se fait d&#x27;abord dans ~/Restores, puis on inspecte et on copie à la main. Hors Borg : Téléchargements, ISO, Jeux et les VM, exportées manuellement ; le système est reconstruit depuis le dépôt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
  <rect width="360" height="1605" fill="#F7F9FC"/>
  <rect x="0" y="0" width="360" height="7" fill="#346AC4"/>
  <text x="40" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#1A2C43">Sauvegarde Borg</text>
  <rect x="10" y="90" width="340" height="525" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="30" y="123" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2959B4">01 · SOURCES SAUVEGARDÉES</text>
  <rect x="10" y="785" width="340" height="410" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="30" y="818" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2959B4">02 · CONTRÔLER ET RESTAURER</text>
  <rect x="10" y="1231" width="340" height="345" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.5"/>
  <text x="30" y="1264" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2959B4">03 · NON COUVERT PAR BORG</text>
  <line x1="180.0" y1="615.0" x2="180.0" y2="651.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="752.0" x2="180.0" y2="785.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="1053.0" x2="180.0" y2="1086.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="22" y="146" width="316" height="101" rx="14" fill="#E8F6EF" stroke="#198263" stroke-width="1.8"/>
  <text x="180.0" y="181.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Données de /data</text>
  <text x="180.0" y="204.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Documents · Projets ·</text>
  <text x="180.0" y="227.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">IA/Openclaw</text>
  <rect x="22" y="280" width="316" height="124" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="315.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Dossiers personnels</text>
  <text x="180.0" y="338.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Bureau · Images · Vidéos ·</text>
  <text x="180.0" y="361.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Musique</text>
  <text x="180.0" y="384.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">~/Development</text>
  <rect x="22" y="437" width="316" height="147" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="472.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Réglages</text>
  <text x="180.0" y="495.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">.config · .mozilla · .var/app</text>
  <text x="180.0" y="518.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">.local/share</text>
  <text x="180.0" y="541.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">configuration de l&#x27;hôte et du</text>
  <text x="180.0" y="564.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">projet</text>
  <rect x="22" y="651" width="316" height="101" rx="14" fill="#EAF2FF" stroke="#346AC4" stroke-width="1.8"/>
  <text x="180.0" y="686.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Dépôt Borg</text>
  <text x="180.0" y="709.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">SSD externe Kingston XS1000</text>
  <text x="180.0" y="732.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">ext4 · sans chiffrement</text>
  <rect x="22" y="841" width="316" height="101" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="876.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Contrôles de validation</text>
  <text x="180.0" y="899.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">borg check --verify-data</text>
  <text x="180.0" y="922.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">restauration canari</text>
  <rect x="22" y="975" width="316" height="78" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="1010.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Restauration en staging</text>
  <text x="180.0" y="1033.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">~/Restores/fedora-gnome-custom</text>
  <rect x="22" y="1086" width="316" height="78" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="1121.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Inspection et copie</text>
  <text x="180.0" y="1144.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">sans écrasement en place</text>
  <rect x="22" y="1287" width="316" height="124" rx="14" fill="#FFFFFF" stroke="#7C8A9C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="180.0" y="1322.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">Hors Borg</text>
  <text x="180.0" y="1345.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Téléchargements · ISO · Jeux</text>
  <text x="180.0" y="1368.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">disques, XML et NVRAM des VM :</text>
  <text x="180.0" y="1391.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">export manuel</text>
  <rect x="22" y="1444" width="316" height="101" rx="14" fill="#FFFFFF" stroke="#7C8A9C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="180.0" y="1479.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">T705 nº1 : système</text>
  <text x="180.0" y="1502.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">reconstruit depuis le dépôt, pas</text>
  <text x="180.0" y="1525.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">restauré</text>
</svg>
