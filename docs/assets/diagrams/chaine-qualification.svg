<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" width="1320" height="600" role="img" aria-labelledby="title desc">
  <title id="title">La chaîne de qualification</title>
  <desc id="desc">Dix étapes : 1, CI au commit exact sur GitHub ; 2, contrôle Live USB sur le PC (PREINSTALL_ONLY, preuve exportée) ; 3, installation de Fedora et import de la preuve ; 4, baseline matérielle ; 5, dry-run ; 6, sauvegarde Borg pré-APPLY vérifiée ; 7, APPLY protégé sur le PC physique ; 8, redémarrage sur Linux amont N ; 9, Gate 3 ; 10, Golden release. Une évolution du matériel, du code ou de la configuration invalide les preuves concernées.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1320" height="600" fill="#FFFFFF"/>
  <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">La chaîne de qualification</text>
  <line x1="330.0" y1="145.0" x2="370.0" y2="145.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0" y1="145.0" x2="680.0" y2="145.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950.0" y1="145.0" x2="990.0" y2="145.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1125.0" y1="200.0" x2="1125.0" y2="260.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990.0" y1="315.0" x2="950.0" y2="315.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680.0" y1="315.0" x2="640.0" y2="315.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505.0" y1="370.0" x2="505.0" y2="430.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0" y1="485.0" x2="680.0" y2="485.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950.0" y1="485.0" x2="990.0" y2="485.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="90" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="195.0" y="131.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">1. CI au commit exact</text>
  <text x="195.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">GitHub : contrats,</text>
  <text x="195.0" y="169.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">laboratoires QEMU</text>
  <rect x="370" y="90" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="505.0" y="131.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">2. Live USB sur le PC</text>
  <text x="505.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">PREINSTALL_ONLY</text>
  <text x="505.0" y="169.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">preuve exportée</text>
  <rect x="680" y="90" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="815.0" y="131.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">3. Installation</text>
  <text x="815.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Fedora sur le SSD</text>
  <text x="815.0" y="169.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">import de la preuve Live</text>
  <rect x="990" y="90" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="1125.0" y="131.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">4. Baseline</text>
  <text x="1125.0" y="150.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">santé matérielle</text>
  <text x="1125.0" y="169.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">avant l&#x27;APPLY</text>
  <rect x="990" y="260" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="1125.0" y="301.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">5. Dry-run</text>
  <text x="1125.0" y="320.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">toutes les mutations</text>
  <text x="1125.0" y="339.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">neutralisées</text>
  <rect x="680" y="260" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="815.0" y="301.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">6. Sauvegarde</text>
  <text x="815.0" y="320.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Borg pré-APPLY</text>
  <text x="815.0" y="339.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">vérifiée, canari restauré</text>
  <rect x="370" y="260" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="505.0" y="301.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">7. APPLY protégé</text>
  <text x="505.0" y="320.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">phrase de confirmation</text>
  <text x="505.0" y="339.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">PC physique uniquement</text>
  <rect x="370" y="430" width="270" height="110" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="505.0" y="481.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">8. Redémarrage</text>
  <text x="505.0" y="500.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Linux amont N</text>
  <rect x="680" y="430" width="270" height="110" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="815.0" y="471.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">9. Gate 3</text>
  <text x="815.0" y="490.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">doctors, cinq veilles</text>
  <text x="815.0" y="509.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">certification</text>
  <rect x="990" y="430" width="270" height="110" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="1125.0" y="471.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">10. Golden release</text>
  <text x="1125.0" y="490.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">statut certifié</text>
  <text x="1125.0" y="509.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">invalidé si tout change</text>
</svg>
