<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1663" width="360" height="1663" role="img" aria-labelledby="title desc">
  <title id="title">CI, fusion et release</title>
  <desc id="desc">Le workflow Tests lance sept jobs : logic-contracts, installer-audit, borg-fedora, fedora-gnome-vm natif, fedora45-gnome-vm avec six extensions, upstream-kernel et rocky-devops-vm. Le job contracts exige leurs sept succès ; sur une pull request qui ne change que la documentation, il accepte seulement que les trois VM soient sautées. La fusion dans main exige contracts et cinq autres contextes : shellcheck, guards, packages, packages-and-integration et nautilus-ptyxis. Après la fusion, les mêmes workflows et le scan de sécurité tournent sur le commit de main. Le workflow release.yml ne démarre que si son manifeste ou ses fichiers de workflow/résolution changent ; il exige alors les contrôles verts du même commit avant publication.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#547BB4"/></marker>
  </defs>
