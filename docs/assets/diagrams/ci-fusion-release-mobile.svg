  <rect x="22" y="348" width="316" height="68" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="390.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">borg-fedora</text>
  <rect x="22" y="449" width="316" height="68" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="180.0" y="491.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">fedora-gnome-vm (natif)</text>
  <rect x="22" y="550" width="316" height="68" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
