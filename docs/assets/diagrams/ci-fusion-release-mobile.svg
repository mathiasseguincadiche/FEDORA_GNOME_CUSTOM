  <line x1="180.0" y1="1346.0" x2="180.0" y2="1379.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180.0" y1="1480.0" x2="180.0" y2="1513.0" stroke="#547BB4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
