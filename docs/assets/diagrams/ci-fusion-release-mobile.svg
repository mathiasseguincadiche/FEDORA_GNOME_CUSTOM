  <text x="180.0" y="188.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">logic-contracts</text>
  <rect x="22" y="247" width="316" height="68" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
