  <text x="30" y="920" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2959B4">02 · CONTRATS ET CONTEXTES</text>
  <line x1="180.0" y1="851.0" x2="180.0" y2="887.0" stroke="#547BB4" stroke-width="2" marker-end="url(#arrow)"/>
