  <text x="220.0" y="219.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">installer-audit</text>
  <rect x="60" y="254" width="320" height="52" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="220.0" y="285.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">borg-fedora</text>
  <rect x="60" y="320" width="320" height="52" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="220.0" y="351.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">fedora-gnome-vm (natif)</text>
  <rect x="60" y="386" width="320" height="52" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="220.0" y="417.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">fedora45-gnome-vm (6 ext.)</text>
  <rect x="60" y="452" width="320" height="52" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="220.0" y="483.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">upstream-kernel / rpm</text>
