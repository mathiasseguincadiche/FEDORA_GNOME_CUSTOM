<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="1320" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Ce qui doit être vert : fusion puis release</title>
  <desc id="desc">Le workflow Tests lance sept jobs : logic-contracts, installer-audit, borg-fedora, fedora-gnome-vm natif, fedora45-gnome-vm avec six extensions, upstream-kernel et rocky-devops-vm. Le job contracts exige leurs sept succès ; sur une pull request qui ne change que la documentation, il accepte seulement que les trois VM soient sautées. La fusion dans main exige contracts et cinq autres contextes : shellcheck, guards, packages, packages-and-integration et nautilus-ptyxis. Après la fusion, les mêmes workflows et le scan de sécurité tournent sur le commit de main ; release.yml ne publie la préversion que si tout est vert sur ce même commit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1320" height="760" fill="#FFFFFF"/>
  <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Ce qui doit être vert : fusion puis release</text>
  <rect x="40" y="80" width="360" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="56" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#334155">Workflow Tests : 7 jobs</text>
