  <line x1="1080.0" y1="234.0" x2="1080.0" y2="300.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080.0" y1="390.0" x2="1080.0" y2="460.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080.0" y1="540.0" x2="1080.0" y2="610.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="122" width="320" height="52" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="220.0" y="153.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">logic-contracts</text>
