  <rect x="60" y="320" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
  <text x="220.0" y="355.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">fedora-gnome-vm (natif)</text>
  <rect x="60" y="386" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#C4D5E8" stroke-width="1.8"/>
