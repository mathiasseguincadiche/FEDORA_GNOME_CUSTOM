  <text x="1080.0" y="521.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">mêmes workflows + Security scanning</text>
  <rect x="880" y="610" width="400" height="100" rx="14" fill="#E8F6EF" stroke="#198263" stroke-width="1.8"/>
  <text x="1080.0" y="645.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1A2C43">release.yml (sous conditions)</text>
  <text x="1080.0" y="669.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">préversion après contrôles verts</text>
  <text x="1080.0" y="693.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C43">sur le même commit</text>
  <rect x="1010.4" y="414.0" width="139.2" height="20" rx="4" fill="#FFFFFF"/>
  <text x="1080.0" y="429.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">après la fusion</text>
  <rect x="955.3" y="564.0" width="249.4" height="20" rx="4" fill="#FFFFFF"/>
  <text x="1080.0" y="579.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#1A2C43">si fichiers release modifiés</text>
</svg>
