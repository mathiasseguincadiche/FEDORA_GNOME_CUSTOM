  <text x="1080.0" y="341.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Fusion autorisée</text>
  <text x="1080.0" y="360.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">6 contextes obligatoires verts</text>
  <rect x="880" y="460" width="400" height="80" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="1080.0" y="496.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">push sur main</text>
  <text x="1080.0" y="515.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">mêmes workflows + Security scanning</text>
  <rect x="880" y="610" width="400" height="100" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="1080.0" y="646.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">release.yml</text>
  <text x="1080.0" y="665.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">préversion si tout est vert</text>
  <text x="1080.0" y="684.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">sur le même commit</text>
  <rect x="1023.6" y="414.0" width="112.8" height="20" rx="4" fill="#FFFFFF"/>
  <text x="1080.0" y="429.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#0F172A">après la fusion</text>
</svg>
