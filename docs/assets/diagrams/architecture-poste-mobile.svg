  <text x="180.0" y="968.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">VM</text>
  <rect x="22" y="1021" width="316" height="101" rx="14" fill="#E8F6EF" stroke="#198263" stroke-width="1.8"/>
  <text x="180.0" y="1056.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">SSD externe · Borg</text>
  <text x="180.0" y="1079.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">XS1000 · dépôt non chiffré</text>
  <text x="180.0" y="1102.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Restaurer en zone isolée</text>
