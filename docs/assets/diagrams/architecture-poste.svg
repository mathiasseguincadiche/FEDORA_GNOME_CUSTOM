<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="1320" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Le poste obtenu : usages et stockage</title>
  <desc id="desc">Le PC cible exécute Fedora 45 Workstation (Wayland, SELinux, firewalld). Fedora porte quatre usages : bureau GNOME 51, DevOps avec KVM, jeu vidéo et noyau Linux amont avec secours Fedora. Le premier T705 contient le système Btrfs, réinstallé depuis le dépôt. Le second T705 porte /data en EXT4, conservé lors d&#x27;une réinstallation : documents, projets et IA sont sauvegardés par Borg sur le SSD externe XS1000 ; ISO et jeux sont hors Borg par défaut ; les disques des VM s&#x27;exportent à la main.</desc>
