<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Un poste Fedora, deux rôles de stockage</title>
  <desc id="desc">Le PC cible utilise Fedora 45 avec GNOME 51, DevOps/KVM, jeu et noyau Linux amont. Sur deux SSD Crucial T705 distincts, le système Btrfs peut être réinstallé tandis que /data ext4 est conservé. Sur /data, Documents, Projets et IA sont inclus dans Borg, mais ISO et Jeux ne le sont pas automatiquement ; disques VM exportés manuellement. Borg sauvegarde également des dossiers personnels et réglages décrits dans BACKUP_RESTORE.md. Le SSD Kingston XS1000 est externe. Les contrôles physiques Live USB et Gate 3 restent à réaliser.</desc>
