  <text x="800.0" y="544.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">ISO, Jeux</text>
  <text x="800.0" y="563.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">hors Borg par défaut</text>
  <rect x="980" y="510" width="260" height="76" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1110.0" y="544.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Disques des VM</text>
  <text x="1110.0" y="563.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">libvirt · export manuel</text>
