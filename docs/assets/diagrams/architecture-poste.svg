  <line x1="775.0" y1="436.0" x2="775.0" y2="510.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="803.9" y1="436.0" x2="1006.1" y2="510.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
