  <text x="180.0" y="1151.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A2C43">validate · cert</text>
  <text x="180.0" y="1174.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">Live USB · Gate 3 ·</text>
