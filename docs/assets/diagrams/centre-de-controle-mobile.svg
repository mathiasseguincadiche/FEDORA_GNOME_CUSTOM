  <text x="180.0" y="249.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">façade mince</text>
  <text x="180.0" y="272.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A2C43">aucune logique métier</text>
