<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Fedora 44 Golden Workstation — architecture directe</title>
<desc id="desc">Vue directe du matériel cible, du système Fedora 44, du stockage persistant, des usages, de la sauvegarde, de la maintenance et de la certification.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6d829d"/></marker>
  <style>
    text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0d1b44}
    .title{font-size:42px;font-weight:800}
    .subtitle{font-size:20px;font-weight:500;fill:#405779}
    .section{font-size:25px;font-weight:800}
    .card{font-size:18px;font-weight:800}
    .small{font-size:15px;font-weight:500;fill:#334c6d}
