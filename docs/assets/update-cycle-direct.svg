<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
<title id="title">Cycle de mises à jour Fedora 44 Golden Workstation</title>
<desc id="desc">Cinq étapes : sauvegarder, préparer les mises à jour, appliquer DNF5 hors ligne, redémarrer et finaliser, puis diagnostiquer.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f6f98"/></marker>
  <style>
    text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0d1b44}
    .kicker{font-size:18px;font-weight:700;fill:#4f6f98}
    .title{font-size:34px;font-weight:800}
    .step{font-size:22px;font-weight:800}
    .sub{font-size:16px;font-weight:500;fill:#405779}
    .num{font-size:22px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>
<rect width="1400" height="300" fill="#fff"/>
<text x="40" y="48" class="title">Cycle de mise à jour</text>
<text x="40" y="78" class="kicker">Sauvegarder → appliquer → redémarrer → vérifier</text>

<g transform="translate(40 112)">
  <rect width="230" height="128" rx="18" fill="#fff4dc" stroke="#f0b34b"/>
  <circle cx="34" cy="34" r="22" fill="#f59e0b"/><text x="34" y="35" class="num">1</text>
  <text x="68" y="36" class="step">Backup Restic</text>
  <text x="24" y="76" class="sub">Snapshot vérifié avant</text>
  <text x="24" y="100" class="sub">toute mutation système</text>
</g>

<line x1="285" y1="176" x2="330" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(340 112)">
  <rect width="250" height="128" rx="18" fill="#eaf4ff" stroke="#7bb8ed"/>
  <circle cx="34" cy="34" r="22" fill="#2385d8"/><text x="34" y="35" class="num">2</text>
  <text x="68" y="36" class="step">Préparer</text>
  <text x="24" y="76" class="sub">Résoudre les updates</text>
  <text x="24" y="100" class="sub">+ Kernel latest-stable</text>
</g>

<line x1="605" y1="176" x2="650" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(660 112)">
  <rect width="230" height="128" rx="18" fill="#ffeceb" stroke="#ee8c86"/>
  <circle cx="34" cy="34" r="22" fill="#e65b52"/><text x="34" y="35" class="num">3</text>
  <text x="68" y="36" class="step">DNF5 offline</text>
  <text x="24" y="76" class="sub">Transaction protégée</text>
  <text x="24" y="100" class="sub">hors session active</text>
</g>

<line x1="905" y1="176" x2="950" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(960 112)">
  <rect width="250" height="128" rx="18" fill="#eef0ff" stroke="#9da7ef"/>
  <circle cx="34" cy="34" r="22" fill="#6d63db"/><text x="34" y="35" class="num">4</text>
  <text x="68" y="36" class="step">Reboot + finalize</text>
  <text x="24" y="76" class="sub">Kernel N / N-1 · GRUB</text>
  <text x="24" y="100" class="sub">Flatpak · firmware check</text>
</g>

<line x1="1225" y1="176" x2="1260" y2="176" stroke="#4f6f98" stroke-width="4" marker-end="url(#arrow)"/>

<g transform="translate(1270 112)">
  <rect width="110" height="128" rx="18" fill="#eaf9f1" stroke="#67c998"/>
  <circle cx="34" cy="34" r="22" fill="#20a46f"/><text x="34" y="35" class="num">5</text>
  <text x="24" y="76" class="step" font-size="19">PASS</text>
  <text x="24" y="100" class="sub">Diagnostics</text>
</g>
</svg>