# Display recovery policy for the ASUS 1440p/240 Hz OLED
DISPLAY_REPAIR_ENABLED="true"
DISPLAY_TARGET_WIDTH="2560"
DISPLAY_TARGET_HEIGHT="1440"
DISPLAY_TARGET_REFRESH_HZ="240"
DISPLAY_TARGET_SCALE="1.0"
DISPLAY_TARGET_COLOR_MODE="default"
DISPLAY_TARGET_RGB_RANGE="full"
DISPLAY_REPAIR_ON_RESUME="true"
DISPLAY_REPAIR_ON_MONITOR_CHANGE="true"
DISPLAY_REPAIR_ON_DRM_HOTPLUG="true"
DISPLAY_CERT_TOLERANCE_HZ="1.0"
