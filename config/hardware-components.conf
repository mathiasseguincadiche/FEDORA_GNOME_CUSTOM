# Hardware-specific completion policy for MSI MAG B850M MORTAR WIFI.
HARDWARE_REQUIRE_AMD_UCODE="true"
HARDWARE_REQUIRE_INTEL_GPU_FIRMWARE="true"
HARDWARE_REQUIRE_5G_LAN="true"
HARDWARE_LAN_DRIVER="r8169"
HARDWARE_LAN_MIN_CAPABILITY_MBPS="5000"
HARDWARE_REQUIRE_WIFI="true"
HARDWARE_REQUIRE_WIFI7_CAPABILITY="true"
HARDWARE_REQUIRE_6GHZ_CAPABILITY="true"
HARDWARE_REQUIRE_BLUETOOTH="true"
HARDWARE_REQUIRE_ALC4080_AUDIO="true"
HARDWARE_REQUIRE_XHCI="true"
HARDWARE_USB_RESUME_ERROR_WINDOW_MIN="15"

# Known-good software matrix: capture actual versions on the certified bare-metal host.
SOFTWARE_MATRIX_REQUIRED_PACKAGES="linux-firmware amd-ucode-firmware intel-gpu-firmware mesa-dri-drivers mesa-vulkan-drivers mutter gnome-shell nautilus qemu-kvm libvirt"
SOFTWARE_MATRIX_INVALIDATE_ON_CHANGE="true"

# KVM storage profile. The benchmark is explicit and never runs during workstation APPLY.
KVM_IO_PROFILE_DEFAULT="io_uring"
KVM_IO_PROFILE_STATE="${HOME}/.local/state/fedora-gnome-custom/kvm-io-profile.env"
KVM_IO_BENCHMARK_SIZE="2G"
KVM_IO_BENCHMARK_RUNTIME_S="20"
KVM_IO_BENCHMARK_IODEPTH="32"
KVM_IO_BENCHMARK_BS="4k"
KVM_IO_CACHE_MODE="none"
KVM_IO_DISCARD="unmap"
KVM_IO_DETECT_ZEROES="unmap"
KVM_IO_IOTHREADS="1"
