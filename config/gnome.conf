ENABLE_RPMFUSION="true"
ENABLE_FLATHUB="true"
ENABLE_GNOME_EXTENSIONS="true"

ENABLE_DASH_TO_DOCK="true"
DASH_TO_DOCK_PACKAGE="gnome-shell-extension-dash-to-dock"
DASH_TO_DOCK_UUID="dash-to-dock@micxgx.gmail.com"
PRESERVE_DASH_TO_DOCK_UPSTREAM_DEFAULTS="true"

# Curated GNOME Shell favorites. Order is intentional and certified.
GNOME_DOCK_FAVORITES_ENABLED="true"
GNOME_DOCK_FAVORITES="org.gnome.Nautilus.desktop brave-browser.desktop org.gnome.Ptyxis.desktop code.desktop com.bitwarden.desktop.desktop com.slack.Slack.desktop libreoffice-startcenter.desktop org.gnome.Software.desktop"

# Disabled in the Golden Workstation profile: compositor blur is cosmetic and adds a variable to 240 Hz/resume stability.
ENABLE_BLUR_MY_SHELL="false"
BLUR_MY_SHELL_PACKAGE="gnome-shell-extension-blur-my-shell"
BLUR_MY_SHELL_UUID="blur-my-shell@aunetx"
PRESERVE_BLUR_MY_SHELL_UPSTREAM_DEFAULTS="true"

# Functional tray compatibility for professional applications using AppIndicator/KStatusNotifierItem.
ENABLE_APPINDICATOR="true"
APPINDICATOR_PACKAGE="gnome-shell-extension-appindicator"
APPINDICATOR_UUID="appindicatorsupport@rgcjonas.gmail.com"

# Functional desktop surface. Fedora 44 does not ship DING as an RPM, so use the exact GNOME-reviewed v95 artifact.
ENABLE_DESKTOP_ICONS_NG="true"
DING_UUID="ding@rastersoft.com"
DING_SOURCE_URL="https://extensions.gnome.org/review/download/74408.shell-extension.zip"
DING_REVIEW_ID="74408"
DING_VERSION="95"
DING_SHELL_VERSION="50"
DING_SCHEMA="org.gnome.shell.extensions.ding"
DING_DESKTOP_DIR_NAME="Bureau"
DING_SHOW_TRASH="true"
DING_SHOW_HOME="false"
DING_SHOW_VOLUMES="false"
DING_SHOW_NETWORK_VOLUMES="false"

# Functional Show Desktop control. The source is an immutable GNOME Extensions review artifact (version 8 / review 70326).
ENABLE_SHOW_DESKTOP_PLUS="true"
SHOW_DESKTOP_PLUS_UUID="show-desktop-plus@attentivecoder"
SHOW_DESKTOP_PLUS_SOURCE_URL="https://extensions.gnome.org/review/download/70326.shell-extension.zip"
SHOW_DESKTOP_PLUS_REVIEW_ID="70326"
SHOW_DESKTOP_PLUS_VERSION="8"
SHOW_DESKTOP_PLUS_SHELL_VERSION="50"
SHOW_DESKTOP_PLUS_SCHEMA="org.gnome.shell.extensions.show-desktop-plus"
SHOW_DESKTOP_PLUS_BUTTON_POSITION="left-end"
SHOW_DESKTOP_PLUS_LEFT_CLICK_ACTION="toggle-desktop"
SHOW_DESKTOP_PLUS_MIDDLE_CLICK_ACTION="hide-focused"
SHOW_DESKTOP_PLUS_CURRENT_MONITOR_ONLY="false"
SHOW_DESKTOP_PLUS_ENABLE_HOTKEY="true"
SHOW_DESKTOP_PLUS_HOTKEY="<Super>d"
SHOW_DESKTOP_PLUS_ICON_STYLE="desktop"
SHOW_DESKTOP_PLUS_SHOW_HIDDEN_COUNT="false"

# Readable top-bar telemetry. Resource Monitor v28 is the GNOME-reviewed extension used for CPU/RAM/network/Intel GPU monitoring.
ENABLE_RESOURCE_MONITOR="true"
RESOURCE_MONITOR_UUID="Resource_Monitor@Ory0n"
RESOURCE_MONITOR_SOURCE_URL="https://extensions.gnome.org/review/download/70909.shell-extension.zip"
RESOURCE_MONITOR_REVIEW_ID="70909"
RESOURCE_MONITOR_VERSION="28"
RESOURCE_MONITOR_SHELL_VERSION="50"
RESOURCE_MONITOR_SCHEMA="org.gnome.shell.extensions.resource-monitor"
RESOURCE_MONITOR_REFRESH_SECONDS="2"
RESOURCE_MONITOR_POSITION="right"
RESOURCE_MONITOR_SHOW_ICONS="true"
RESOURCE_MONITOR_CPU_USAGE="true"
RESOURCE_MONITOR_CPU_TEMPERATURE="true"
RESOURCE_MONITOR_RAM="true"
RESOURCE_MONITOR_NETWORK="true"
RESOURCE_MONITOR_GPU_USAGE="true"
RESOURCE_MONITOR_GPU_TEMPERATURE="true"

INSTALL_EXTENSION_MANAGER="true"
EXTENSION_MANAGER_FLATPAK_ID="com.mattjakeman.ExtensionManager"
ENABLE_JUST_PERFECTION="false"

# Golden desktop ergonomics: explicitly keep all three standard window controls on the right.
GNOME_WINDOW_BUTTONS_ENABLED="true"
GNOME_WINDOW_BUTTON_LAYOUT=":minimize,maximize,close"

PRESERVE_FONT_RENDERING_DEFAULTS="true"
PRESERVE_DISPLAY_EXPERIMENTAL_DEFAULTS="true"
NAUTILUS_ENABLE_SMB="true"
NAUTILUS_ENABLE_MTP="true"
NAUTILUS_ENABLE_PREVIEWS="true"
INTEL_MEDIA_DRIVER_POLICY="auto"
VAAPI_DRM_DEVICE="/dev/dri/renderD128"
