# On-demand KVM guest profiles. No VM is created automatically by workstation APPLY.
VM_PROFILE_DEFAULT_NETWORK="devops-nat"
VM_PROFILE_DEFAULT_POOL="devops-data"
VM_PROFILE_AUTOSTART="false"
VM_PROFILE_REQUIRE_INTERACTIVE_CREATE="true"
VM_PROFILE_GPU_PASSTHROUGH_ALLOWED="false"
VM_NAUTILUS_ACCESS_ENABLED="true"

VM_DISK_CACHE_MODE="${KVM_IO_CACHE_MODE:-none}"
VM_DISK_IO_DEFAULT="${KVM_IO_PROFILE_DEFAULT:-io_uring}"
VM_DISK_DISCARD="${KVM_IO_DISCARD:-unmap}"
VM_DISK_DETECT_ZEROES="${KVM_IO_DETECT_ZEROES:-unmap}"
VM_IOTHREADS="${KVM_IO_IOTHREADS:-1}"

ROCKY_SERVER_NAME="rocky-devops"
ROCKY_SERVER_RELEASE="10.2"
ROCKY_SERVER_VCPU="6"
ROCKY_SERVER_RAM_MB="16384"
ROCKY_SERVER_DISK_GB="160"
ROCKY_SERVER_DISK_FORMAT="qcow2"
ROCKY_SERVER_MACHINE="q35"
ROCKY_SERVER_CPU_MODE="host-passthrough"
ROCKY_SERVER_FIRMWARE="uefi"
ROCKY_SERVER_DISK_BUS="virtio"
ROCKY_SERVER_NETWORK_MODEL="virtio"
ROCKY_SERVER_NETWORK="devops-nat"
ROCKY_SERVER_GRAPHICS="none"
ROCKY_SERVER_CLOUD_INIT="true"
ROCKY_SERVER_CLOUD_IMAGE_REQUIRED="true"
ROCKY_SERVER_CLOUD_IMAGE_VERIFICATION_REQUIRED="true"
ROCKY_SERVER_CLOUD_IMAGE_SUMS_FILENAME="CHECKSUM"
ROCKY_SERVER_CLOUD_IMAGE_SIGNATURE_FILENAME="CHECKSUM.asc"
ROCKY_SERVER_USERNAME="mathias"
ROCKY_SERVER_PASSWORD_MODE="runtime-prompt"
ROCKY_SERVER_SSH_PUBLIC_KEY_PATH="${HOME}/.ssh/id_ed25519.pub"
ROCKY_SERVER_NAUTILUS_LABEL="Rocky DevOps"
ROCKY_SERVER_BOOTSTRAP_SCRIPT="guest/rocky-devops/bootstrap-devops.sh"
ROCKY_SERVER_VERIFY_SCRIPT="guest/rocky-devops/verify-devops.sh"
ROCKY_SERVER_QEMU_GUEST_AGENT="true"
ROCKY_SERVER_VIRTIO_RNG="true"
ROCKY_SERVER_MEMORY_BALLOON="true"
ROCKY_SERVER_AUTOSTART="false"
