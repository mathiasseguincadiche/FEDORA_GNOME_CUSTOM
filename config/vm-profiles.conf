# On-demand KVM guest profiles. No VM is created automatically by workstation APPLY.
VM_PROFILE_DEFAULT_NETWORK="devops-nat"
VM_PROFILE_DEFAULT_POOL="devops-data"
VM_PROFILE_AUTOSTART="false"
VM_PROFILE_REQUIRE_INTERACTIVE_CREATE="true"
VM_PROFILE_GPU_PASSTHROUGH_ALLOWED="false"
VM_NAUTILUS_ACCESS_ENABLED="true"

VM_DISK_CACHE_MODE="${KVM_IO_CACHE_MODE:-none}"
VM_DISK_IO_DEFAULT="${KVM_IO_PROFILE_DEFAULT:-io_uring}"
VM_DISK_DISCARD="${KVM_IO_DISCARD:-unmap}"
VM_DISK_DETECT_ZEROES="${KVM_IO_DETECT_ZEROES:-unmap}"
VM_IOTHREADS="${KVM_IO_IOTHREADS:-1}"

UBUNTU_SERVER_NAME="ubuntu-devops"
UBUNTU_SERVER_RELEASE="26.04"
UBUNTU_SERVER_VCPU="6"
UBUNTU_SERVER_RAM_MB="16384"
UBUNTU_SERVER_DISK_GB="160"
UBUNTU_SERVER_DISK_FORMAT="qcow2"
UBUNTU_SERVER_MACHINE="q35"
UBUNTU_SERVER_CPU_MODE="host-passthrough"
UBUNTU_SERVER_FIRMWARE="uefi"
UBUNTU_SERVER_DISK_BUS="virtio"
UBUNTU_SERVER_NETWORK_MODEL="virtio"
UBUNTU_SERVER_NETWORK="devops-nat"
UBUNTU_SERVER_GRAPHICS="none"
UBUNTU_SERVER_CLOUD_INIT="true"
UBUNTU_SERVER_CLOUD_IMAGE_REQUIRED="true"
UBUNTU_SERVER_USERNAME="mathias"
UBUNTU_SERVER_PASSWORD_MODE="runtime-prompt"
UBUNTU_SERVER_SSH_PUBLIC_KEY_PATH="${HOME}/.ssh/id_ed25519.pub"
UBUNTU_SERVER_NAUTILUS_LABEL="Ubuntu DevOps"
UBUNTU_SERVER_BOOTSTRAP_SCRIPT="guest/ubuntu-devops/bootstrap-devops.sh"
UBUNTU_SERVER_VERIFY_SCRIPT="guest/ubuntu-devops/verify-devops.sh"
UBUNTU_SERVER_QEMU_GUEST_AGENT="true"
UBUNTU_SERVER_VIRTIO_RNG="true"
UBUNTU_SERVER_MEMORY_BALLOON="true"
UBUNTU_SERVER_AUTOSTART="false"

WINDOWS11_NAME="windows-11"
WINDOWS11_VCPU="4"
WINDOWS11_RAM_MB="12288"
WINDOWS11_DISK_GB="128"
WINDOWS11_DISK_FORMAT="qcow2"
WINDOWS11_MACHINE="q35"
WINDOWS11_CPU_MODE="host-passthrough"
WINDOWS11_FIRMWARE="uefi-secureboot"
WINDOWS11_TPM_VERSION="2.0"
WINDOWS11_TPM_BACKEND="emulator"
WINDOWS11_DISK_BUS="virtio"
WINDOWS11_NETWORK_MODEL="virtio"
WINDOWS11_NETWORK="devops-nat"
WINDOWS11_VIDEO="virtio"
WINDOWS11_GRAPHICS="spice"
WINDOWS11_REQUIRE_INSTALL_ISO="true"
WINDOWS11_REQUIRE_VIRTIO_DRIVERS="true"
WINDOWS11_QEMU_GUEST_AGENT="true"
WINDOWS11_VIRTIO_RNG="true"
WINDOWS11_MEMORY_BALLOON="true"
WINDOWS11_SPICE_CHANNEL="true"
WINDOWS11_SMB_SHARE_NAME="VM-Share"
WINDOWS11_NAUTILUS_LABEL="Windows VM"
WINDOWS11_SMB_SETUP_SCRIPT="guest/windows-11/configure-smb-share.ps1"
WINDOWS11_INTEGRATION_SCRIPT="guest/windows-11/configure-guest-integration.ps1"
WINDOWS11_GUEST_TOOLS_ISO_NAME="windows-guest-tools.iso"
WINDOWS11_AUTOSTART="false"
