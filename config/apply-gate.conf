# Verrou de l'APPLY réel : seul ce fichier arme le passage de --dry-run à --apply (lib/apply_gate.sh).
# REAL_MACHINE_APPROVED doit être posé par le propriétaire sur la machine physique ; APPLY_CONFIRMATION est la phrase exacte à taper.
# REQUIRE_CLEAN_GIT et REQUIRE_SAME_COMMIT_DRYRUN exigent un dépôt propre et un dry-run vérifié du même commit.

REAL_APPLY_FEATURE_ENABLED="true"
REAL_MACHINE_APPROVED="false"
APPLY_CONFIRMATION="APPLY FEDORA 45 WORKSTATION"
REQUIRE_CLEAN_GIT="true"
REQUIRE_SAME_COMMIT_DRYRUN="true"
