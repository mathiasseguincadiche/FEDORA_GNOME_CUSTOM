# Golden workstation performance/certification policy
NAUTILUS_COLDSTART_TARGET_MS="1200"
NAUTILUS_COLDSTART_HARD_LIMIT_MS="2000"
NAUTILUS_PREVIEW_POLICY="local-only"
NAUTILUS_PREWARM_PORTALS="true"
NAUTILUS_PREWARM_GIO="true"
# Legacy compatibility escape hatch only. Fedora 44 current typing-booster builds no longer justify removal by default.
REMOVE_IBUS_TYPING_BOOSTER="false"
FINAL_CERT_MIN_SUSPEND_CYCLES="5"
FINAL_CERT_FINGERPRINT_PACKAGES="linux-firmware intel-gpu-firmware mesa-dri-drivers mesa-vulkan-drivers mutter gnome-shell"
BASELINE_MEMORY_TEST_SECONDS="3600"
