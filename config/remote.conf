# Accès distant sécurisé (ADR 0017) : Tailscale + SSH + Wake-on-LAN, Sunshine en option.
# Profil optionnel, DÉSACTIVÉ par défaut : activer dans config/local.conf (REMOTE_ENABLE="true")
# après lecture de docs/REMOTE_ACCESS.md. Rien ici n'ouvre de port sur Internet.
REMOTE_ENABLE="false"

# Réseau privé Tailscale. La plage 100.64.0.0/10 est protégée statiquement du réseau des VM KVM.
REMOTE_TAILSCALE_INTERFACE="tailscale0"
REMOTE_TAILSCALE_ZONE="fgc-tailnet"
REMOTE_TAILNET_CIDR="100.64.0.0/10"

# SSH : par clés uniquement, sans root. "false" retire le service ssh de la zone firewalld par défaut
# (le LAN n'atteint plus SSH ; seul le tailnet y accède, y compris depuis la maison).
REMOTE_SSH_LAN="false"

# Wake-on-LAN sur l'Ethernet filaire (profil NetworkManager). Le .link systemd est un filet de sécurité
# à n'activer que si le Gate 3 montre que le réglage est perdu après arrêt complet.
REMOTE_WOL_ENABLE="true"
REMOTE_WOL_MODE="magic"
REMOTE_WOL_LINK_FALLBACK="false"

# Sunshine (flux graphique, client Moonlight). Optionnel : nécessite une session graphique ouverte.
# Les ports sont ceux par défaut documentés par LizardByte ; l'interface web (47990) n'est jamais ouverte.
REMOTE_SUNSHINE_ENABLE="false"
REMOTE_SUNSHINE_COPR="lizardbyte/stable"
REMOTE_SUNSHINE_TCP_PORTS="47984 47989 48010"
REMOTE_SUNSHINE_UDP_PORTS="47998 47999 48000"

# Démarrage sans clavier : ouverture de session automatique GDM, puis verrouillage immédiat.
# Compromis explicite : sans chiffrement des disques (ADR 0002), l'accès physique reste un accès au compte.
REMOTE_AUTOLOGIN="false"
REMOTE_LOCK_ON_AUTOLOGIN="true"

# Autorise l'utilisateur de la workstation à éteindre le PC par SSH sans mot de passe (polkit).
REMOTE_POWEROFF_POLKIT="false"
