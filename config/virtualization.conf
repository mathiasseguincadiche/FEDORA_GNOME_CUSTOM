# Fedora 44 KVM/QEMU/libvirt policy
ENABLE_KVM="true"
LIBVIRT_URI="qemu:///system"
KVM_OPERATOR_GROUPS="libvirt,kvm"

# Dedicated virtualization storage. The project never partitions or formats disks.
# /data must be mounted manually on the dedicated second Crucial T705 before real APPLY.
KVM_REQUIRE_DEDICATED_STORAGE="true"
KVM_DATA_MOUNT="/data"
KVM_DATA_FSTYPE="ext4"
KVM_POOL_NAME="devops-data"
KVM_POOL_PATH="/data/libvirt/images"
KVM_POOL_AUTOSTART="true"
KVM_STORAGE_SELINUX_TYPE="virt_image_t"

# Custom private NAT.
KVM_NETWORK_NAME="devops-nat"
KVM_NETWORK_AUTOSTART="true"
KVM_BRIDGE_NAME="virbr50"
KVM_NETWORK_CIDR="192.168.50.0/24"
KVM_GATEWAY="192.168.50.254"
KVM_NETMASK="255.255.255.0"
KVM_DHCP_START="192.168.50.100"
KVM_DHCP_END="192.168.50.200"
KVM_DNS_1="9.9.9.9"
KVM_DNS_2="1.1.1.1"
KVM_IPV6_ENABLED="false"
KVM_FIREWALLD_REQUIRED="true"
KVM_FIREWALLD_ZONE="libvirt"
KVM_BLOCK_PHYSICAL_LAN="true"
KVM_PRESERVE_FIREWALLD="true"
KVM_NFT_TABLE="fedora_gnome_custom_kvm"
KVM_FAIL_CLOSED="true"
KVM_ALLOW_HOST_VM="true"
KVM_ALLOW_VM_VM="true"
KVM_ALLOW_VM_INTERNET="true"
KVM_ALLOW_INBOUND_FORWARDING="false"

# Capabilities required for the workstation virtualization stack.
KVM_REQUIRE_UEFI="true"
KVM_REQUIRE_TPM="true"
KVM_REQUIRE_OSINFO="true"

# VM creation remains explicit and interactive. Profiles are templates only.
CREATE_DEVOPS_VM="false"
VM_PROFILE_AUTOSTART="false"
VM_PROFILE_REQUIRE_INTERACTIVE_CREATE="true"

# Hard architecture rule: the Intel Arc B580 always remains owned by the HOST.
ALLOW_GPU_PASSTHROUGH="false"
