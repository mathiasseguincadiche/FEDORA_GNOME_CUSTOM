# Backup / restore policy
REQUIRE_PREAPPLY_BACKUP="true"
# Borg 1.x, UNENCRYPTED repository: explicit owner decision (ADR 0014).
# The repository on the external disk is readable by anyone who holds the disk.
BACKUP_ENGINE="borg"
BACKUP_ENCRYPTION="none"
BACKUP_FAIL_CLOSED="true"
BACKUP_REQUIRE_EXTERNAL_TARGET="true"
BACKUP_INTEGRITY_CHECK_REQUIRED="true"
BACKUP_RESTORE_TEST_REQUIRED="true"
BACKUP_MAX_AGE_HOURS="24"

# The repository is a runtime value: set BACKUP_REPOSITORY in config/local.conf
# (local path on the external disk, or ssh://user@host/path). When it is empty,
# the pre-APPLY helper auto-detects exactly one mounted external USB/hotplug
# target (e.g. the XS1000) and uses <mount>/Backup-Fedora/borg.
BACKUP_REPOSITORY=""
BACKUP_PREAPPLY_REPOSITORY_SUBDIR="Backup-Fedora/borg"
BACKUP_PREAPPLY_REQUIRED_FSTYPE="ext4"
BACKUP_PREAPPLY_MIN_FREE_GIB="20"
BACKUP_PREAPPLY_CONFIRMATION_PHRASE="JE_CONFIRME_LA_CREATION_DU_BACKUP_PRE_APPLY"

# Protected assets.
BACKUP_HOST_CONFIG="true"
BACKUP_PROJECT_CONFIG="true"
BACKUP_LIBVIRT_METADATA="true"
BACKUP_VM_DISKS="true"
BACKUP_VM_CLOUD_INIT_METADATA="true"
BACKUP_VM_SHUTDOWN_REQUIRED="true"
BACKUP_ALLOW_LIVE_QCOW2_COPY="false"

# Retention is periodic but remains independent from backup creation. The daily
# backup never deletes archives itself; a dedicated weekly user timer runs
# `borg prune` on fgc-full-* and fgc-daily-* archives, then `borg compact`.
# Pre-APPLY archives (rollback points) are never pruned automatically.
BACKUP_KEEP_DAILY="7"
BACKUP_KEEP_WEEKLY="4"
BACKUP_KEEP_MONTHLY="6"
# Archives refused by certification are kept as fgc-pending-* for review;
# retention keeps only the newest ones so they never fill the disk.
BACKUP_KEEP_PENDING="3"
BACKUP_PRUNE_AUTOMATICALLY="true"
BACKUP_RETENTION_TIMER_ENABLED="true"
BACKUP_RETENTION_ON_CALENDAR="Sun *-*-* 04:15:00"
BACKUP_RETENTION_RANDOMIZED_DELAY_SEC="1800"

# Restores are staging-first. No helper overwrites /, /etc, /boot, $HOME or the
# active libvirt image pool in place.
BACKUP_RESTORE_STAGING_ROOT="${HOME}/Restores/fedora-gnome-custom"

# Daily user-data protection. The timer skips cleanly when the external/remote
# Borg repository is unavailable; pre-APPLY backup remains strictly fail-closed.
# XDG Documents is mapped to /data/Documents by the persistent-data module.
# /data/Projets is also protected explicitly. /data/ISO stays persistent on the
# second T705 but is intentionally excluded from daily backups by default because
# ISO payloads are large and normally reproducible/re-downloadable.
DAILY_BACKUP_ENABLED="true"
DAILY_BACKUP_MAX_AGE_HOURS="36"
DAILY_BACKUP_XDG_DIRS="DESKTOP DOCUMENTS PICTURES VIDEOS MUSIC"
DAILY_BACKUP_EXTRA_PATHS="/data/Projets Development .config .ssh .gnupg .mozilla .var/app .local/share"
DAILY_BACKUP_EXCLUDE_DOWNLOADS="true"
