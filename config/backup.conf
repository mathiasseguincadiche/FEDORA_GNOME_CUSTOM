# Backup / restore policy
REQUIRE_PREAPPLY_BACKUP="true"
BACKUP_ENGINE="restic"
BACKUP_FAIL_CLOSED="true"
BACKUP_REQUIRE_EXTERNAL_TARGET="true"
BACKUP_ENCRYPTION_REQUIRED="true"
BACKUP_INTEGRITY_CHECK_REQUIRED="true"
BACKUP_RESTORE_TEST_REQUIRED="true"
BACKUP_MAX_AGE_HOURS="24"

# Repository and password are runtime values. They must never be committed.
# BACKUP_REPOSITORY may be set in config/local.conf. When it is empty, the
# pre-APPLY helper auto-detects exactly one mounted external USB/hotplug target.
BACKUP_REPOSITORY=""
BACKUP_PASSWORD_FILE=""
BACKUP_PREAPPLY_REPOSITORY_SUBDIR="Backup-Fedora/restic"
BACKUP_PREAPPLY_PASSWORD_FILE_RELATIVE=".config/fedora-gnome-custom/secrets/restic-password"
BACKUP_PREAPPLY_REQUIRED_FSTYPE="ext4"
BACKUP_PREAPPLY_MIN_FREE_GIB="20"
BACKUP_PREAPPLY_CONFIRMATION_PHRASE="JE_CONFIRME_LA_CREATION_DU_BACKUP_PRE_APPLY"

# Protected assets.
BACKUP_HOST_CONFIG="true"
BACKUP_PROJECT_CONFIG="true"
BACKUP_LIBVIRT_METADATA="true"
BACKUP_VM_DISKS="true"
BACKUP_VM_CLOUD_INIT_METADATA="true"
BACKUP_VM_SHUTDOWN_REQUIRED="true"
BACKUP_ALLOW_LIVE_QCOW2_COPY="false"

# Retention is explicit; backup creation never silently prunes old snapshots.
RESTIC_KEEP_DAILY="7"
RESTIC_KEEP_WEEKLY="4"
RESTIC_KEEP_MONTHLY="6"
BACKUP_PRUNE_AUTOMATICALLY="false"

# Restores are staging-first. No helper overwrites /, /etc, /boot, $HOME or the
# active libvirt image pool in place.
BACKUP_RESTORE_STAGING_ROOT="${HOME}/Restores/fedora-gnome-custom"
