# Ubuntu-grade finishing layer on top of upstream GNOME 50 (ADR 0013).
# Goal: the desktop polish Ubuntu adds to GNOME (dock, tiling, start on the
# desktop, consistent legacy apps) without changing distribution or theming
# GNOME Shell. Every value below is applied by modules/gnome/24c_ubuntu_polish.sh
# and verified by diagnostics/polish-doctor.
GNOME_POLISH_ENABLED="true"

# Dock: Ubuntu Dock layout applied to the official Fedora Dash to Dock RPM.
POLISH_DOCK_ENABLED="true"
POLISH_DOCK_POSITION="LEFT"
POLISH_DOCK_EXTEND_HEIGHT="true"
# QD-OLED screen (ROG Strix XG27AQDMES): a permanently fixed dock is a static
# bright element. "Intellihide" keeps the Ubuntu dock visible on an empty
# desktop and hides it as soon as a window overlaps it.
POLISH_DOCK_FIXED="false"
POLISH_DOCK_INTELLIHIDE="true"
POLISH_DOCK_ICON_SIZE="48"
# Click on a running app: focus it, click again to minimize, previews if several windows.
POLISH_DOCK_CLICK_ACTION="focus-minimize-or-previews"
POLISH_DOCK_RUNNING_INDICATOR="DOTS"
# The Trash is already on the desktop (DING); mounted volumes appear in Nautilus.
POLISH_DOCK_SHOW_TRASH="false"
POLISH_DOCK_SHOW_MOUNTS="false"
# Open the session on the desktop instead of the Activities overview (Ubuntu behaviour).
POLISH_START_ON_DESKTOP="true"

# OLED care for the QD-OLED panel: dark style by default, screen dimmed then
# blanked when idle. The monitor's own pixel shift / panel care stay enabled.
POLISH_OLED_CARE="true"
POLISH_COLOR_SCHEME="prefer-dark"
POLISH_IDLE_DELAY_SECONDS="300"
POLISH_IDLE_DIM="true"

# Shell and windows.
POLISH_ACCENT_COLOR="orange"
POLISH_CLOCK_SHOW_WEEKDAY="true"
POLISH_CENTER_NEW_WINDOWS="true"

# Legacy GTK3 apps (LibreOffice, FileZilla, Remmina...) drawn like libadwaita apps.
# The theme follows the light/dark switch of GNOME Settings automatically.
POLISH_GTK3_ADWAITA_LOOK="true"
POLISH_GTK3_THEME_LIGHT="adw-gtk3"
POLISH_GTK3_THEME_DARK="adw-gtk3-dark"

# Ubuntu "Enhanced Tiling": quarter tiling, tiling popup and tile groups.
# Pinned to the upstream GitHub release (same project Ubuntu ships) and its SHA-256.
ENABLE_TILING_ASSISTANT="true"
TILING_ASSISTANT_UUID="tiling-assistant@leleat-on-github"
TILING_ASSISTANT_SOURCE_URL="https://github.com/Leleat/Tiling-Assistant/releases/download/v55/tiling-assistant@leleat-on-github.shell-extension.zip"
TILING_ASSISTANT_VERSION="55"
TILING_ASSISTANT_SHELL_VERSION="50"
TILING_ASSISTANT_SHA256="7bc50a3bc597c8a6fb45f900040aa7696864ec1b2ce494b569c7b22303b30b26"
