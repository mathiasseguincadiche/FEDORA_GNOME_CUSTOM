# Linux upstream stable only (ADR 0015); RPM packaging is independent of Fedora pushes.
KERNEL_CHANNEL="vanilla"
ENABLE_KERNEL_VANILLA_STABLE="true"
KERNEL_VANILLA_COPR="@kernel-vanilla/stable"
# Compare the RPM candidate with kernel.org latest_stable before installing.
# No RC, snapshot, custom patchset or silently older packaged kernel is accepted.
KERNEL_MIN_VERSION="7.2.9"
KERNEL_REQUIRE_LATEST_STABLE="true"
KERNEL_KEEP_FEDORA_FALLBACK="false"
KERNEL_BLOCK_SECURE_BOOT="true"
KERNEL_VENDOR_CHANGE_ALLOWED="true"
