# Fedora Kernel Vanilla stable lifecycle policy
ENABLE_KERNEL_VANILLA_STABLE="true"
KERNEL_VANILLA_COPR="@kernel-vanilla/stable"
KERNEL_MIN_VERSION="7.2.2"

# Golden policy: latest stable is only a candidate until bare-metal certification.
KERNEL_LIFECYCLE_MODE="candidate-certified"
KERNEL_CANDIDATE_TRACK_LATEST_STABLE="true"
KERNEL_REQUIRE_LATEST_STABLE="false"
KERNEL_CERTIFICATION_REQUIRED="true"
KERNEL_KEEP_PREVIOUS_CERTIFIED="true"
KERNEL_KEEP_FEDORA_FALLBACK="true"
KERNEL_BLOCK_SECURE_BOOT="true"
KERNEL_VENDOR_CHANGE_ALLOWED="true"
KERNEL_ONE_SHOT_TEST_BOOT="true"
KERNEL_REQUIRED_SUSPEND_CYCLES="5"
