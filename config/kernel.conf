# Fedora Kernel Vanilla stable channel.
# KERNEL_REQUIRE_LATEST_STABLE means the staged CANDIDATE tracks the latest stable
# package. Promotion to Golden is governed separately by kernel-lifecycle.policy.
ENABLE_KERNEL_VANILLA_STABLE="true"
KERNEL_VANILLA_COPR="@kernel-vanilla/stable"
KERNEL_MIN_VERSION="7.2.2"
KERNEL_REQUIRE_LATEST_STABLE="true"
KERNEL_KEEP_FEDORA_FALLBACK="true"
KERNEL_BLOCK_SECURE_BOOT="true"
KERNEL_VENDOR_CHANGE_ALLOWED="true"
