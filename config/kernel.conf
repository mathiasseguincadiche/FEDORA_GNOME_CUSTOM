# Linux amont stable uniquement (ADR 0015) ; le paquetage RPM est ind\u00e9pendant des publications Fedora.
KERNEL_CHANNEL="vanilla"
ENABLE_KERNEL_VANILLA_STABLE="true"
KERNEL_VANILLA_COPR="@kernel-vanilla/stable"
# Comparer le RPM candidat \u00e0 latest_stable de kernel.org avant installation.
# Aucune RC, aucun snapshot, aucun patchset personnalis\u00e9 ni noyau packag\u00e9 silencieusement plus ancien n'est accept\u00e9.
KERNEL_MIN_VERSION="7.2.9"
KERNEL_REQUIRE_LATEST_STABLE="true"
# When kernel.org is unreachable or the RPM still lags behind it, a system
# update defers ONLY the kernel (excluded from the transaction, running N kept)
# instead of blocking every other security update. "false" = block everything.
KERNEL_DEFER_WHEN_UNAVAILABLE="true"
# Keep one signed Fedora kernel as a non-default GRUB fallback beside upstream N/N-1.
KERNEL_KEEP_FEDORA_FALLBACK="true"
KERNEL_BLOCK_SECURE_BOOT="true"
KERNEL_VENDOR_CHANGE_ALLOWED="true"
