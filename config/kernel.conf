# Kernel lifecycle policy (ADR 0010 rolling N/N-1, ADR 0012 kernel channels).
#
# KERNEL_CHANNEL selects the kernel that the project installs and keeps as N/N-1:
#   cachyos -> bieszczaders/kernel-cachyos (BORE scheduler, sched-ext, x86-64-v3)
#   vanilla -> @kernel-vanilla/stable (upstream stable, no extra patches)
# With the cachyos channel, the kernel-core track (official Fedora kernel, or
# Kernel Vanilla if its COPR is still enabled) stays installed as a rescue entry.
KERNEL_CHANNEL="cachyos"

# Master switch of the system.kernel module (historical name kept for stability).
ENABLE_KERNEL_VANILLA_STABLE="true"
KERNEL_VANILLA_COPR="@kernel-vanilla/stable"
KERNEL_CACHYOS_COPR="bieszczaders/kernel-cachyos"
# Upstream kernel-cachyos requirement on SELinux hosts: setsebool domain_kernel_load_modules on.
# This is an explicit, reviewed trade-off (ADR 0012); set to false to refuse it.
KERNEL_CACHYOS_SELINUX_MODULE_LOAD="true"
# Only needed for out-of-tree modules (akmods/DKMS). The Golden HOST has none.
KERNEL_CACHYOS_INSTALL_DEVEL="false"

# KERNEL_REQUIRE_LATEST_STABLE means full system updates track and install the
# latest stable release of the selected channel directly. Golden recertification
# remains a post-update runtime proof, not a pre-boot promotion gate.
KERNEL_MIN_VERSION="7.2.2"
KERNEL_REQUIRE_LATEST_STABLE="true"
# No *pinned* Fedora fallback is managed by the project (ADR 0010); with the
# cachyos channel the kernel-core track is still present as a rescue entry.
KERNEL_KEEP_FEDORA_FALLBACK="false"
KERNEL_BLOCK_SECURE_BOOT="true"
KERNEL_VENDOR_CHANGE_ALLOWED="true"
