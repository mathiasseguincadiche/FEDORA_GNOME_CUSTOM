name: Final hardening text patch

on:
  push:
    branches: [hardening/0.14.0-final-rc]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/0.14.0-final-rc
      - name: Apply deterministic 0.14.0 migration patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))

          # Release metadata without rewriting historical changelog content.
          p = Path('CHANGELOG.md')
          text = p.read_text()
          if '## 0.14.0 — 2026-09-03' not in text:
              entry = '''## 0.14.0 — 2026-09-03

- **Final Hardening / Release Candidate** : fermeture des écarts pré-1.0 sans nouveau socle fonctionnel.
- Runtime fail-closed : un environnement dont le bare-metal n'est pas positivement prouvé devient `unknown` et ne peut pas ouvrir l'APPLY.
- Orchestrateur durci : chaque module doit fournir `precheck`, `plan`, `apply` et `postcheck`; un APPLY en échec conserve son code retour et produit un rapport de convergence partielle.
- Correction Arc B580/VA-API : le render node est résolu par PCI `8086:e20b` au lieu de supposer `/dev/dri/renderD128` sur un HOST multi-GPU.
- DING review `74408`, Show Desktop Plus review `70326` et Resource Monitor review `70909` sont vérifiés par SHA-256 exact avant installation.
- Backup quotidien lié au SHA réellement appliqué; le prune reste manuel mais applique la rétention aux snapshots `full` et `daily`.
- Kickstart : serveur `sshd` HOST désactivé, `openssh-clients` conservé pour les connexions HOST → VM.
- Guard KVM étendu aux routes IPv4 non-default du HOST afin de bloquer LAN, VPN et réseaux d'entreprise tout en conservant la sortie Internet via la route par défaut.
- Les Flatpaks `community-unverified` doivent être présents dans une allowlist versionnée explicite.
- Choix Golden confirmés : pas de LUKS imposé, pas de Secure Boot HOST, `kernel-vanilla/stable` latest-stable avec kernels Fedora conservés comme fallback.
- Documentation synchronisée avec Resource Monitor et la politique 0.14.0.

'''
              p.write_text(text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1))

          replace('tests/test_pre1_hardening_contract.sh', "[[ \"$(<\"$ROOT/VERSION\")\" == '0.13.0' ]]", "[[ \"$(<\"$ROOT/VERSION\")\" == '0.14.0' ]]")
          replace('tests/test_pre1_hardening_contract.sh', "grep -Fq '**Golden Workstation 0.13.0**' \"$ROOT/README.md\"", "grep -Fq '**Golden Workstation 0.14.0**' \"$ROOT/README.md\"")
          replace('tests/test_pre1_hardening_contract.sh', "grep -Fq '## 0.13.0 — 2026-09-01' \"$ROOT/CHANGELOG.md\"", "grep -Fq '## 0.14.0 — 2026-09-03' \"$ROOT/CHANGELOG.md\"")
          replace('tests/test_workstation_control_center_contract.sh', '== "0.13.0"', '== "0.14.0"')
          replace('tests/test_workstation_control_center_contract.sh', 'VERSION must be 0.13.0', 'VERSION must be 0.14.0')

          # Portal / backup / supply-chain documentation.
          replace('docs/README.md', 'vraie convergence graphique DING + Show Desktop dans une VM strictement identifiée VirtualBox', 'vraie convergence graphique DING + Show Desktop + Resource Monitor CPU/RAM/réseau dans une VM strictement identifiée VirtualBox')

          p = Path('docs/BACKUP_RESTORE.md')
          text = p.read_text()
          text = text.replace('Pour appliquer la rétention 7 daily / 4 weekly / 6 monthly en même temps :', 'Pour appliquer manuellement la rétention 7 daily / 4 weekly / 6 monthly aux snapshots `full` **et** `daily` :')
          text = text.replace('Le pruning n\'est jamais lancé automatiquement par la convergence.', 'Le pruning n\'est jamais lancé automatiquement par la convergence ni par le timer quotidien. `--prune` exécute les deux politiques `forget` puis un unique `restic prune`.')
          if 'SHA appliqué' not in text:
              text = text.replace('Le script refuse une source XDG ambiguë', 'Le timer est lié au **SHA appliqué** : si le checkout versionné change ou si ses fichiers suivis sont modifiés sans nouvel APPLY, le backup automatique bloque au lieu de sourcer silencieusement un runtime différent.\n\nLe script refuse une source XDG ambiguë')
          if 'copie de récupération hors machine' not in text:
              text = text.replace('## Disaster Recovery\n', '## Secret de récupération\n\nLa passphrase Restic n\'est volontairement jamais incluse dans les snapshots. Une **copie de récupération hors machine** (gestionnaire de mots de passe/coffre indépendant) est donc obligatoire pour qu\'un dépôt Restic reste exploitable après perte totale du SSD système.\n\n## Disaster Recovery\n')
          p.write_text(text)

          p = Path('docs/SUPPLY_CHAIN.md')
          text = p.read_text()
          if '## Extensions GNOME revues' not in text:
              text += '''\n## Extensions GNOME revues\n\nLes extensions téléchargées directement depuis GNOME Extensions sont verrouillées par review, version **et SHA-256** :\n\n```text\nDING 74408 / v95             48175f0b5c1f8a1a724d761198c91d6994e91e28aec685605ae6a240b0a95aae\nShow Desktop Plus 70326 / v8 9ceab00be63b93c4eade16cf804bf4edd587632750aa89b78e317673fd6016a9\nResource Monitor 70909 / v28  18f49cf20bd8f96f22f6048d7404e51cb414c1aea94ca16d0c2ad3634e9d8bf2\n```\n\nUn changement de contenu derrière une URL review existante est donc refusé avant `gnome-extensions install`.\n'''
              p.write_text(text)

          # KVM route-isolation semantics.
          replace('modules/virtualization/34_kvm_network.sh', "log_error KVM 'physical network isolation precheck failed'", "log_error KVM 'protected host-network isolation precheck failed'")
          replace('modules/virtualization/34_kvm_network.sh', "is_true \"${KVM_BLOCK_PHYSICAL_LAN:-true}\" || return \"$EXIT_PRECHECK_FAILED\"", "is_true \"${KVM_BLOCK_PHYSICAL_LAN:-true}\" || return \"$EXIT_PRECHECK_FAILED\"\n    is_true \"${KVM_BLOCK_ROUTED_HOST_NETWORKS:-true}\" || return \"$EXIT_PRECHECK_FAILED\"")
          replace('modules/virtualization/34_kvm_network.sh', 'project-owned nftables guard blocks VM<->physical-LAN forwarding only', 'project-owned nftables guard blocks VM<->protected HOST networks (LAN + non-default routed VPN/enterprise networks)')
          replace('diagnostics/virtualization-doctor', "grep -Fq 'block VM to physical LAN'", "grep -Fq 'block VM to protected host networks'")
          replace('diagnostics/virtualization-doctor', "record OK 'LAN isolation' enforced", "record OK 'Host-network isolation' 'LAN/VPN routes enforced'")
          replace('diagnostics/virtualization-doctor', "record KO 'LAN isolation' 'guard rule missing'", "record KO 'Host-network isolation' 'guard rule missing'")
          replace('diagnostics/virtualization-doctor', "record WARN 'LAN isolation' 'guard service active; privileged nft inspection unavailable'", "record WARN 'Host-network isolation' 'guard service active; privileged nft inspection unavailable'")
          replace('diagnostics/virtualization-doctor', "record KO 'LAN isolation' 'guard inactive'", "record KO 'Host-network isolation' 'guard inactive'")

          p = Path('tests/test_kvm_network_fail_closed.sh')
          text = p.read_text()
          text = text.replace('normal block VM to physical LAN', 'normal block VM to protected host networks')
          text = text.replace('normal block physical LAN to VM', 'normal block protected host networks to VM')
          text = text.replace('KVM LAN CIDR coverage', 'KVM protected CIDR coverage')
          if 'blocked_host_ipv4' not in text:
              text = text.replace("grep -Fq 'guard_mode=' \"$guard\"", "grep -Fq 'guard_mode=' \"$guard\"\ngrep -Fq 'blocked_host_ipv4' \"$guard\"\ngrep -Fq 'protected_networks=' \"$guard\"\ngrep -Fq 'KVM_BLOCK_ROUTED_HOST_NETWORKS=\"true\"' \"$ROOT/config/virtualization.conf\"")
          p.write_text(text)

          p = Path('docs/KVM_NETWORK.md')
          text = p.read_text()
          text = text.replace('blocked_physical_ipv4', 'blocked_host_ipv4')
          text = text.replace('réseaux IPv4 directement attachés à l\'uplink courant', 'réseaux IPv4 protégés par les routes explicites du HOST')
          text = text.replace('Le contrat courant bloque les **réseaux IPv4 directement connectés aux interfaces physiques et l\'uplink IPv4 par défaut** détectés par le host.\n\nIl ne prétend pas, à lui seul, constituer une politique générique de segmentation pour toutes les routes d\'entreprise, tous les VPN ou tous les tunnels qu\'un opérateur pourrait ajouter ultérieurement.\n\nSi une future version doit interdire aussi des réseaux routés/VPN spécifiques, ils devront être intégrés explicitement au contrat et recertifiés. Cette précision évite de présenter une portée de sécurité plus large que l\'implémentation réelle.', 'Le contrat courant bloque les **routes IPv4 non-default du HOST** : réseaux directement connectés, LAN, routes VPN/entreprise et tunnels explicitement routés. La route IPv4 `default` reste volontairement hors du set afin de conserver VM → Internet.\n\nUn nouveau VPN ou une nouvelle route d\'entreprise déclenche le reconcile NetworkManager ; si la nouvelle table ne peut pas être validée, le guard reste en mode emergency.')
          text = text.replace('physical_networks=', 'protected_networks=')
          p.write_text(text)

          # systemd hardening for the privileged nftables helper.
          p = Path('virtualization/systemd/fedora-gnome-custom-kvm-guard.service')
          text = p.read_text()
          if 'NoNewPrivileges=yes' not in text:
              text = text.replace('RemainAfterExit=yes\n', 'RemainAfterExit=yes\nNoNewPrivileges=yes\nPrivateTmp=yes\nProtectSystem=strict\nProtectHome=yes\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectControlGroups=yes\nCapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW\nRestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6\n')
              p.write_text(text)

          # Control Center exposes the explicitly manual retention action.
          p = Path('lib/control_center.sh')
          text = p.read_text()
          if "cc_option 9 'Appliquer rétention Restic'" not in text:
              text = text.replace("    cc_option 8 'Plan Disaster Recovery'\n", "    cc_option 8 'Plan Disaster Recovery'\n    cc_option 9 'Appliquer rétention Restic' 'manuel: full + daily'\n")
              text = text.replace("      8) cc_interactive_exec 'PLAN DISASTER RECOVERY' \"$REPO_ROOT/scripts/backup/disaster-recovery.sh\" ;;\n", "      8) cc_interactive_exec 'PLAN DISASTER RECOVERY' \"$REPO_ROOT/scripts/backup/disaster-recovery.sh\" ;;\n      9)\n        if cc_confirm 'Créer un backup complet puis appliquer la rétention Restic full + daily ?'; then\n          cc_interactive_exec 'RÉTENTION RESTIC MANUELLE' \"$REPO_ROOT/scripts/backup/backup-now.sh\" --prune\n        fi\n        ;;\n")
              text = text.replace("        dr-plan) \"$REPO_ROOT/scripts/backup/disaster-recovery.sh\" ;;\n", "        dr-plan) \"$REPO_ROOT/scripts/backup/disaster-recovery.sh\" ;;\n        prune) \"$REPO_ROOT/scripts/backup/backup-now.sh\" --prune ;;\n")
              p.write_text(text)

          p = Path('docs/CONTROL_CENTER.md')
          text = p.read_text()
          if 'rétention Restic manuelle' not in text:
              text = text.replace('- plan Disaster Recovery.', '- plan Disaster Recovery ;\n- rétention Restic manuelle `full + daily` via `backup prune`.')
              p.write_text(text)

          # Resource Monitor / reviewed extension hashes are now part of contract tests.
          p = Path('tests/test_resource_monitor_contract.sh')
          text = p.read_text()
          if 'RESOURCE_MONITOR_SHA256=' not in text:
              text = text.replace("  'RESOURCE_MONITOR_SHELL_VERSION=\"50\"' \\\n", "  'RESOURCE_MONITOR_SHELL_VERSION=\"50\"' \\\n  'RESOURCE_MONITOR_SHA256=\"18f49cf20bd8f96f22f6048d7404e51cb414c1aea94ca16d0c2ad3634e9d8bf2\"' \\\n")
          if "sha256sum --check" not in text:
              text = text.replace("  'site_version=28'; do", "  'site_version=28' \\\n  'sha256sum --check'; do")
          p.write_text(text)

          # New behavioral + final-hardening contract.
          Path('tests/test_final_hardening_contract.sh').write_text(r'''#!/usr/bin/env bash
set -Eeuo pipefail
ROOT="$(cd "$(dirname "$0")/.." && pwd)"

[[ "$(tr -d '[:space:]' < "$ROOT/VERSION")" == 0.14.0 ]]
grep -Fq '**Golden Workstation 0.14.0**' "$ROOT/README.md"
grep -Fq '## 0.14.0 — 2026-09-03' "$ROOT/CHANGELOG.md"

# User-decided HOST policy.
grep -Fq 'services --enabled=NetworkManager,firewalld --disabled=sshd' "$ROOT/installer/generate-fedora44-kickstart.sh"
grep -Fxq 'openssh-clients' < <(sed -n '/%packages/,/%end/p' "$ROOT/installer/generate-fedora44-kickstart.sh")
! grep -Eq 'autopart.*--encrypted|luks' "$ROOT/installer/generate-fedora44-kickstart.sh"
grep -Fq 'KERNEL_REQUIRE_LATEST_STABLE="true"' "$ROOT/config/kernel.conf"
grep -Fq 'KERNEL_KEEP_FEDORA_FALLBACK="true"' "$ROOT/config/kernel.conf"
grep -Fq 'KERNEL_BLOCK_SECURE_BOOT="true"' "$ROOT/config/kernel.conf"

# Bare-metal must be positively proven; ambiguous detection is unknown.
grep -Fq 'runtime_baremetal_proven' "$ROOT/lib/common.sh"
grep -Fq "printf 'unknown\\n'" "$ROOT/lib/common.sh"
grep -Fq 'runtime_is_unknown' "$ROOT/lib/common.sh"

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
cat > "$tmp/systemd-detect-virt" <<'SH'
#!/usr/bin/env sh
case "${1:-}" in
  --container|--vm) exit 1 ;;
  --quiet) exit 2 ;;
esac
exit 2
SH
chmod +x "$tmp/systemd-detect-virt"
(
  PATH="$tmp:$PATH"
  CI=false GITHUB_ACTIONS=false GITLAB_CI=false
  source "$ROOT/lib/common.sh"
  runtime_virtualization_detect() { return 1; }
  [[ "$(runtime_environment_detect)" == unknown ]]
)

# Module lifecycle is behavioral: a missing apply function must fail, never PASS.
cat > "$tmp/fake.sh" <<'SH'
fake_module_precheck() { :; }
fake_module_plan() { :; }
fake_module_postcheck() { :; }
SH
(
  REPO_ROOT="$tmp"
  MODULE_LOG="$tmp/module.log"
  EXIT_CONFIG_FAILED=12
  declare -A CATALOG_PATH=( [fake.module]='fake.sh' )
  declare -A CATALOG_SCOPE=( [fake.module]='TEST' )
  ui_check() { :; }
  is_true() { [[ "${1,,}" == true ]]; }
  repo_commit() { printf unknown; }
  source "$ROOT/lib/orchestrator.sh"
  if orchestrator_run_module fake.module; then
    echo 'missing module apply function was accepted' >&2
    exit 1
  fi
  [[ "${ORCH_RESULTS[*]}" == *'contract missing fake_module_apply'* ]]
)

grep -Fq 'REAL APPLY FAILED rc=' "$ROOT/install.sh"
grep -Fq 'SYSTEM MAY BE PARTIALLY CONVERGED' "$ROOT/install.sh"

# B580 media probes may never assume renderD128.
grep -Fq 'drm_render_node_for_pci_id' "$ROOT/lib/common.sh"
grep -Fq 'drm_render_node_for_pci_id 8086 e20b' "$ROOT/modules/gnome/22_multimedia_codecs.sh"
grep -Fq 'drm_render_node_for_pci_id 8086 e20b' "$ROOT/diagnostics/media-doctor"
! grep -Fq 'VAAPI_DRM_DEVICE="/dev/dri/renderD128"' "$ROOT/config/gnome.conf"

# Reviewed GNOME artifacts are content pinned.
for pair in \
  'DING_SHA256="48175f0b5c1f8a1a724d761198c91d6994e91e28aec685605ae6a240b0a95aae" scripts/gnome/install-ding.sh' \
  'SHOW_DESKTOP_PLUS_SHA256="9ceab00be63b93c4eade16cf804bf4edd587632750aa89b78e317673fd6016a9" scripts/gnome/install-show-desktop-plus.sh' \
  'RESOURCE_MONITOR_SHA256="18f49cf20bd8f96f22f6048d7404e51cb414c1aea94ca16d0c2ad3634e9d8bf2" scripts/gnome/install-resource-monitor.sh'; do
  config_token="${pair% *}"; installer="${pair##* }"
  grep -Fq "$config_token" "$ROOT/config/gnome.conf"
  grep -Fq 'sha256sum --check --status' "$ROOT/$installer"
done

# Backup lifecycle: explicit prune only, daily + full, SHA-bound timer.
grep -Fq 'BACKUP_PRUNE_AUTOMATICALLY="false"' "$ROOT/config/backup.conf"
grep -Fq 'fedora-gnome-custom-full fedora-gnome-custom-daily' "$ROOT/scripts/backup/backup-now.sh"
grep -Fq 'FEDORA_GNOME_CUSTOM_APPLIED_SHA' "$ROOT/scripts/backup/daily-user-backup.sh"
grep -Fq 'FEDORA_GNOME_CUSTOM_APPLIED_SHA=' "$ROOT/modules/backup/60_daily_user_backup.sh"
grep -Fq 'backup prune' "$ROOT/docs/CONTROL_CENTER.md"

# KVM protects routed LAN/VPN networks while default Internet stays outside the set.
grep -Fq 'KVM_BLOCK_ROUTED_HOST_NETWORKS="true"' "$ROOT/config/virtualization.conf"
grep -Fq 'blocked_host_ipv4' "$ROOT/scripts/kvm/kvm_network_guard.sh"
grep -Fq 'protected_networks=' "$ROOT/scripts/kvm/kvm_network_guard.sh"
grep -Fq 'route show table main' "$ROOT/scripts/kvm/kvm_network_guard.sh"
grep -Fq 'prefix" != default' "$ROOT/scripts/kvm/kvm_network_guard.sh"

# Community Flathub trust is explicit.
grep -Fq 'UNVERIFIED_FLATHUB_ALLOWLIST=' "$ROOT/config/applications.conf"
grep -Fq 'professional_apps_validate_provenance' "$ROOT/modules/applications/41_professional_apps.sh"

# Privileged KVM guard is systemd-sandboxed.
for token in NoNewPrivileges=yes ProtectSystem=strict ProtectHome=yes CapabilityBoundingSet=; do
  grep -Fq "$token" "$ROOT/virtualization/systemd/fedora-gnome-custom-kvm-guard.service"
done

echo 'final hardening contract: PASS'
''')

          p = Path('.github/workflows/tests.yml')
          text = p.read_text()
          if 'test_final_hardening_contract.sh' not in text:
              text = text.replace('      - run: bash tests/test_pre1_hardening_contract.sh\n', '      - run: bash tests/test_pre1_hardening_contract.sh\n      - run: bash tests/test_final_hardening_contract.sh\n')
              p.write_text(text)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs lib modules diagnostics tests virtualization .github/workflows/tests.yml
          git commit -m 'hardening: synchronize 0.14.0 contracts and docs [skip ci]'
          git push origin HEAD:hardening/0.14.0-final-rc
