name: Architecture non-regression

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Real-machine gate remains closed in Git
        run: |
          grep -F 'REAL_MACHINE_APPROVED="false"' config/apply-gate.conf
          grep -F 'REAL_MACHINE_APPROVED="false"' config/local.conf.example
          ! grep -n -E '^REAL_MACHINE_APPROVED="?(true|1|yes)"?$' config/*.conf
      - name: Runtime isolation invariants
        run: |
          grep -Fq 'runtime_environment_detect' lib/common.sh
          grep -Fq 'systemd-detect-virt --container' lib/common.sh
          grep -Fq 'systemd-detect-virt --vm' lib/common.sh
          grep -Fq 'apply_gate_require_runtime' lib/apply_gate.sh
          grep -Fq 'runtime_is_baremetal' lib/apply_gate.sh
          grep -Fq 'runtime_is_baremetal' lib/baseline.sh
          grep -Fq 'wsl2)' diagnostic.sh
          grep -Fq 'vm|container)' diagnostic.sh
          grep -Fq 'REAL APPLY is blocked outside bare-metal' diagnostics/wsl2-doctor
      - name: VirtualBox GNOME LAB isolation invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          lab=scripts/lab/apply-gnome-virtualbox.sh
          doctor=diagnostics/virtualbox-gnome-lab-doctor
          test -x "$lab"
          test -x "$doctor"
          grep -Fq 'runtime_is_virtualbox' lib/common.sh
          grep -Fq '== oracle' lib/common.sh
          grep -Fq "grep -Eqi 'VirtualBox|Oracle|innotek'" lib/common.sh
          grep -Fq 'runtime_is_virtualbox' "$lab"
          grep -Fq 'Fedora Linux 44' "$lab"
          grep -Fq 'GNOME Shell 50' "$lab"
          grep -Fq 'Wayland is required for GATE 2' "$lab"
          grep -Fq 'modules/gnome/24b_resource_monitor.sh' "$lab"
          grep -Fq 'gnome_telemetry_apply' "$lab"
          ! grep -Fq 'orchestrator_run_all' "$lab"
          ! grep -Fq 'apply_gate_open' "$lab"
          ! grep -Fq 'modules/system/' "$lab"
          ! grep -Fq 'modules/hardware/' "$lab"
          ! grep -Fq 'modules/virtualization/' "$lab"
          ! grep -Fq 'modules/backup/' "$lab"
          ! grep -Fq 'run_mutating' "$doctor"
          grep -Fq 'Production APPLY guard' "$doctor"
          grep -Fq 'Bare-metal baseline guard' "$doctor"
      - name: Fedora GNOME architecture invariants
        run: |
          grep -F 'REQUIRE_WAYLAND="true"' config/workstation.conf
          grep -F 'ENABLE_JUST_PERFECTION="false"' config/gnome.conf
          grep -F 'ALLOW_GPU_PASSTHROUGH="false"' config/virtualization.conf
          grep -F 'ALLOW_FORCE_PROBE="false"' config/graphics.conf
          ! grep -RInEi --exclude-dir=.git 'virtiofs|virtiofsd|hostshare|/mnt/hostshare|/data/libvirt/shared' config manifests modules scripts guest diagnostics
      - name: Resource Monitor telemetry invariants
        run: |
          grep -Fq 'ENABLE_RESOURCE_MONITOR="true"' config/gnome.conf
          grep -Fq 'RESOURCE_MONITOR_REVIEW_ID="70909"' config/gnome.conf
          grep -Fq 'RESOURCE_MONITOR_VERSION="28"' config/gnome.conf
          grep -Fq 'Resource_Monitor@Ory0n' config/gnome.conf
          grep -Fq 'gnome.telemetry|GNOME|gnome.extensions|modules/gnome/24b_resource_monitor.sh' manifests/module-plan.conf
          grep -Fq '0xe20b' modules/gnome/24b_resource_monitor.sh
          grep -Fq 'gpu_busy_percent' modules/gnome/24b_resource_monitor.sh
          grep -Fq 'gt_busy_percent' modules/gnome/24b_resource_monitor.sh
          grep -Fq 'runtime_is_baremetal' modules/gnome/24b_resource_monitor.sh
          ! grep -RFiq 'Astra Monitor' config manifests modules/gnome scripts/gnome
      - name: KVM network ownership boundary
        run: |
          grep -F 'KVM_NETWORK_CIDR="192.168.50.0/24"' config/virtualization.conf
          grep -F 'KVM_IPV6_ENABLED="false"' config/virtualization.conf
          grep -F 'KVM_BLOCK_PHYSICAL_LAN="true"' config/virtualization.conf
          grep -F 'KVM_ALLOW_INBOUND_FORWARDING="false"' config/virtualization.conf
          grep -F 'KVM_NFT_TABLE="fedora_gnome_custom_kvm"' config/virtualization.conf
          ! grep -RInE 'nft[[:space:]]+flush[[:space:]]+ruleset|iptables[[:space:]]+-F' modules scripts
      - name: Storage and security destructive guards
        run: |
          ! grep -RInE '(mkfs\.|wipefs|parted[[:space:]]|sgdisk[[:space:]]|setenforce[[:space:]]+0|chmod[[:space:]]+777)' modules scripts install.sh
      - name: Ubuntu guest authentication and supply chain
        run: |
          grep -Fq 'ssh_pwauth: false' scripts/kvm/create_ubuntu_devops_vm.sh
          ! grep -Fq 'NOPASSWD:ALL' scripts/kvm/create_ubuntu_devops_vm.sh
          grep -Fq 'awscli-exe-linux-x86_64.zip.sig' guest/ubuntu-devops/bootstrap-devops.sh
          grep -Fq 'gpgv --keyring' guest/ubuntu-devops/bootstrap-devops.sh
          grep -Fq 'KUBERNETES_MINOR="${KUBERNETES_MINOR:-v1.37}"' guest/ubuntu-devops/bootstrap-devops.sh
      - name: Immutable installer source
        run: |
          grep -Fq 'repo_sha="$(git -C "$REPO_ROOT" rev-parse HEAD' installer/generate-fedora44-kickstart.sh
          grep -Fq 'checkout --detach FETCH_HEAD' installer/generate-fedora44-kickstart.sh
          ! grep -Fq 'git clone https://github.com/mathiasseguincadiche/FEDORA_GNOME_CUSTOM.git' installer/generate-fedora44-kickstart.sh
      - name: Backup fail-closed invariants
        run: |
          grep -F 'BACKUP_FAIL_CLOSED="true"' config/backup.conf
          grep -F 'BACKUP_REQUIRE_EXTERNAL_TARGET="true"' config/backup.conf
          grep -F 'BACKUP_ENCRYPTION_REQUIRED="true"' config/backup.conf
          grep -F 'BACKUP_RESTORE_TEST_REQUIRED="true"' config/backup.conf
          grep -F 'BACKUP_VM_SHUTDOWN_REQUIRED="true"' config/backup.conf
          grep -F 'BACKUP_ALLOW_LIVE_QCOW2_COPY="false"' config/backup.conf
          grep -Fq 'evidence_require_current_identity' lib/apply_gate.sh
          grep -Fq 'backup_runtime_validate_preapply_marker' lib/apply_gate.sh
          grep -Fq 'restic cat snapshot' lib/backup_runtime.sh
          grep -Fq 'fedora-gnome-custom-preapply' lib/backup_runtime.sh
          grep -Fq 'effective_config_sha256' prepare-preapply-backup.sh
          grep -Fq 'hardware_fingerprint' prepare-preapply-backup.sh
      - name: No obvious committed secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          scan='grep -RInE --exclude-dir=.git --exclude=non-regression.yml'
          if $scan 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' .; then echo 'Private key material appears committed.' >&2; exit 1; fi
          if $scan 'password[[:space:]]*[:=][[:space:]]*"[^" ]{4,}"' .; then echo 'Potential literal password appears committed.' >&2; exit 1; fi
          if $scan 'token[[:space:]]*[:=][[:space:]]*"[A-Za-z0-9_-]{20,}"' .; then echo 'Potential literal token appears committed.' >&2; exit 1; fi
