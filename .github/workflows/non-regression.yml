name: Architecture non-regression

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Real-machine gate remains closed in Git
        run: |
          grep -F 'REAL_MACHINE_APPROVED="false"' config/apply-gate.conf
          grep -F 'REAL_MACHINE_APPROVED="false"' config/local.conf.example
          ! grep -n -E '^REAL_MACHINE_APPROVED="?(true|1|yes)"?$' config/*.conf
      - name: Runtime isolation invariants
        run: |
          grep -Fq 'runtime_environment_detect' lib/common.sh
          grep -Fq 'apply_gate_require_runtime' lib/apply_gate.sh
          grep -Fq 'runtime_is_baremetal' lib/apply_gate.sh
          grep -Fq 'runtime_is_baremetal' lib/baseline.sh
          grep -Fq 'wsl2)' diagnostic.sh
          grep -Fq 'REAL APPLY is blocked outside bare-metal' diagnostics/wsl2-doctor
      - name: Fedora GNOME architecture invariants
        run: |
          grep -F 'REQUIRE_WAYLAND="true"' config/workstation.conf
          grep -F 'ENABLE_JUST_PERFECTION="false"' config/gnome.conf
          grep -F 'ALLOW_GPU_PASSTHROUGH="false"' config/virtualization.conf
          grep -F 'ALLOW_FORCE_PROBE="false"' config/graphics.conf
          ! grep -RInEi --exclude-dir=.git 'virtiofs|virtiofsd|hostshare|/mnt/hostshare|/data/libvirt/shared' config manifests modules scripts guest diagnostics
      - name: KVM network ownership boundary
        run: |
          grep -F 'KVM_NETWORK_CIDR="192.168.50.0/24"' config/virtualization.conf
          grep -F 'KVM_BLOCK_PHYSICAL_LAN="true"' config/virtualization.conf
          grep -F 'KVM_ALLOW_INBOUND_FORWARDING="false"' config/virtualization.conf
          grep -F 'KVM_NFT_TABLE="fedora_gnome_custom_kvm"' config/virtualization.conf
          ! grep -RInE 'nft[[:space:]]+flush[[:space:]]+ruleset|iptables[[:space:]]+-F' modules scripts
      - name: Storage and security destructive guards
        run: |
          ! grep -RInE '(mkfs\.|wipefs|parted[[:space:]]|sgdisk[[:space:]]|setenforce[[:space:]]+0|chmod[[:space:]]+777)' modules scripts install.sh
      - name: Backup fail-closed invariants
        run: |
          grep -F 'BACKUP_FAIL_CLOSED="true"' config/backup.conf
          grep -F 'BACKUP_REQUIRE_EXTERNAL_TARGET="true"' config/backup.conf
          grep -F 'BACKUP_ENCRYPTION_REQUIRED="true"' config/backup.conf
          grep -F 'BACKUP_RESTORE_TEST_REQUIRED="true"' config/backup.conf
          grep -F 'BACKUP_VM_SHUTDOWN_REQUIRED="true"' config/backup.conf
          grep -F 'BACKUP_ALLOW_LIVE_QCOW2_COPY="false"' config/backup.conf
          grep -F 'marker_commit' lib/apply_gate.sh
          grep -F '$(repo_commit)' lib/apply_gate.sh
      - name: No obvious committed secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          scan='grep -RInE --exclude-dir=.git --exclude=non-regression.yml'
          if $scan 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' .; then
            echo 'Private key material appears committed.' >&2
            exit 1
          fi
          if $scan 'password[[:space:]]*[:=][[:space:]]*"[^" ]{4,}"' .; then
            echo 'Potential literal password appears committed.' >&2
            exit 1
          fi
          if $scan 'token[[:space:]]*[:=][[:space:]]*"[A-Za-z0-9_-]{20,}"' .; then
            echo 'Potential literal token appears committed.' >&2
            exit 1
          fi
