name: Tests
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-hardening:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hardening/0.14.0-final-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/0.14.0-final-rc
      - run: python3 .github/scripts/finalize-0.14.0.py
      - name: Commit finalization patch when needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs lib scripts diagnostics tests
          git commit -m 'chore: finalize 0.14.0 release candidate [skip ci]'
          git push origin HEAD:hardening/0.14.0-final-rc

  contracts:
    needs: finalize-hardening
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash tests/test_structure.sh
      - run: bash tests/test_policy.sh
      - run: bash tests/test_baseline_contract.sh
      - run: bash tests/test_gtk4_apps_policy.sh
      - run: bash tests/test_professional_apps_contract.sh
      - run: bash tests/test_multimedia_contract.sh
      - run: bash tests/test_virtualization_contract.sh
      - run: bash tests/test_kvm_network_fail_closed.sh
      - run: bash tests/test_vm_image_auth_contract.sh
      - run: bash tests/test_wsl2_toolchain_contract.sh
      - run: bash tests/test_install_exit_status_contract.sh
      - run: bash tests/test_ubuntu_devops_bootstrap_contract.sh
      - run: bash tests/test_python_toolchain_contract.sh
      - run: bash tests/test_vm_file_access_contract.sh
      - run: bash tests/test_backup_recovery_contract.sh
      - run: bash tests/test_ci_maturity_contract.sh
      - run: bash tests/test_dash_to_dock_contract.sh
      - run: bash tests/test_desktop_ergonomics_contract.sh
      - run: bash tests/test_resource_monitor_contract.sh
      - run: bash tests/test_virtualbox_gnome_lab_contract.sh
      - run: bash tests/test_workstation_control_center_contract.sh
      - run: bash tests/test_golden_workstation_contract.sh
      - run: bash tests/test_hardware_kvm_completion_contract.sh
      - run: bash tests/test_desktop_lifecycle_contract.sh
      - run: bash tests/test_shell_ux_contract.sh
      - run: bash tests/test_dock_favorites_contract.sh
      - run: bash tests/test_pre1_hardening_contract.sh
      - run: bash tests/test_final_hardening_contract.sh
      - run: bash tests/test_public_entrypoints_contract.sh
      - run: bash tests/test_documentation_contract.sh
