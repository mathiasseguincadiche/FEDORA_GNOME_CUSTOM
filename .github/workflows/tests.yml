name: Tests
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_structure.sh
      - run: bash tests/test_policy.sh
      - run: bash tests/test_baseline_contract.sh
      - run: bash tests/test_gtk4_apps_policy.sh
      - run: bash tests/test_professional_apps_contract.sh
      - run: bash tests/test_multimedia_contract.sh
      - run: bash tests/test_virtualization_contract.sh
      - run: bash tests/test_dash_to_dock_contract.sh
