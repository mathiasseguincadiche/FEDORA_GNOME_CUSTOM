name: Fedora 45 GNOME 51 preview readiness
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'profiles/**'
      - 'lib/fedora_release.sh'
      - 'scripts/development/**'
      - 'tests/test_release_readiness_behavior.sh'
      - 'tests/test_fedora_release_behavior.sh'
      - '.github/workflows/release-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    container: public.ecr.aws/docker/library/fedora:45
    timeout-minutes: 35
    steps:
      - name: Install preview dependencies
        run: dnf5 -y install git python3 borgbackup jq dnf5-plugins curl gnome-shell gnome-shell-extension-dash-to-dock gnome-shell-extension-appindicator
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check the actual preview release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(rpm -E '%fedora')" == 45 ]]
          gnome-shell --version | grep -E '^GNOME Shell 51([.]|$)'
          python3 -m py_compile scripts/development/fedora-profile.py scripts/development/release-readiness.py scripts/kernel/upstream-release.py
          bash tests/test_release_readiness_behavior.sh
          bash tests/test_fedora_release_behavior.sh
          bash tests/test_borg_roundtrip.sh
      - name: Prepare target package metadata
        shell: bash
        run: |
          # Availability failures become explicit readiness blockers below.
          RPMFUSION_FEDORA_RELEASE=45 bash scripts/ci/enable-rpmfusion.sh || true
          dnf5 -y copr enable @kernel-vanilla/stable || true
          # Optional Sunshine manifest (REMOTE_SUNSHINE_ENABLE) resolves only through its COPR.
          dnf5 -y copr enable lizardbyte/stable || true
          install -m 0644 config/repos/vscode.repo /etc/yum.repos.d/vscode.repo
          install -m 0644 config/repos/brave-browser.repo /etc/yum.repos.d/brave-browser.repo
          dnf5 -y makecache --refresh || true
      - name: Collect preview blockers and candidate extension locks
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/development/release-readiness.sh --report-only --latest --output readiness | tee readiness.log
          {
            echo '## Fedora 45 / GNOME 51 preview'
            echo 'This job collects blockers. Its green result is not production qualification.'
            echo '```text'
            cat readiness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora45-readiness-${{ github.run_id }}
          path: |
            readiness/
            readiness.log
          if-no-files-found: error
          retention-days: 14
