name: Config schema preview
on:
  push:
    paths:
      - 'config/**'
      - 'scripts/config/validate-config.sh'
      - '.github/workflows/config-schema-preview.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Emit canonical schema
        run: bash scripts/config/validate-config.sh config --emit-schema
