name: Fedora 44 desktop integration pretest

on:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 0'
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: fedora-44-desktop-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job is a required main-protection status check. Keep the pull_request
  # trigger unfiltered so the nautilus-ptyxis context exists on every PR.
  nautilus-ptyxis:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Nautilus and Ptyxis Golden packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(cat \
            manifests/packages-gnome.txt \
            manifests/packages-nautilus.txt \
            manifests/packages-nautilus-optional.txt \
            manifests/packages-applications-gtk4.txt | sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' | sort -u)
          dnf -y install dbus-daemon "${packages[@]}"
          rpm -q nautilus localsearch xdg-user-dirs-gtk gvfs gvfs-smb gvfs-mtp gvfs-gphoto2 gvfs-fuse gvfs-archive gvfs-afc gvfs-goa gvfs-nfs sushi file-roller-nautilus ptyxis
      - name: Validate File Roller Nautilus extension payload
        shell: bash
        run: |
          set -Eeuo pipefail
          file_roller_payload="$(rpm -ql file-roller-nautilus)"
          grep -Eq '/nautilus/extensions-4/.*\.so$' <<<"${file_roller_payload}"
      - name: Validate Nautilus GSettings schema
        shell: bash
        run: |
          set -Eeuo pipefail
          nautilus_schemas="$(gsettings list-schemas)"
          grep -Fxq 'org.gnome.nautilus.preferences' <<<"${nautilus_schemas}"
      - name: Validate GVfs GIO D-Bus enumeration
        shell: bash
        run: |
          set -Eeuo pipefail
          dbus-run-session -- gio mount -l >/dev/null
      - name: Validate Fedora 44 LocalSearch payload
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q localsearch xdg-user-dirs-gtk
          test -x /usr/bin/localsearch
          localsearch_payload="$(rpm -ql localsearch)"
          grep -Fxq '/usr/lib/systemd/user/localsearch-3.service' <<<"${localsearch_payload}"
          grep -Fxq '/usr/share/dbus-1/services/org.freedesktop.LocalSearch3.service' <<<"${localsearch_payload}"
      - name: Validate native Nautilus executable and Fedora Ptyxis binding
        shell: bash
        run: |
          set -Eeuo pipefail
          nautilus_bin="$(command -v nautilus)"
          test -n "${nautilus_bin}"
          test -x "${nautilus_bin}"
          nautilus_owner="$(rpm -qf "${nautilus_bin}")"
          grep -Eq '^nautilus-[0-9]' <<<"${nautilus_owner}"
          LC_ALL=C grep -aFq 'org.gnome.Ptyxis' "${nautilus_bin}"
      - name: Validate native Ptyxis payload
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v ptyxis >/dev/null
          test -r /usr/share/applications/org.gnome.Ptyxis.desktop
      - name: Validate Ptyxis GSettings schema
        shell: bash
        run: |
          set -Eeuo pipefail
          ptyxis_schemas="$(gsettings list-schemas)"
          grep -Fxq 'org.gnome.Ptyxis' <<<"${ptyxis_schemas}"
      - name: Validate Ptyxis CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q ptyxis
          test -x /usr/bin/ptyxis
          LC_ALL=C grep -aFq 'working-directory' /usr/bin/ptyxis
      - name: Validate Golden native desktop IDs
        shell: bash
        run: |
          set -Eeuo pipefail
          for desktop in \
            org.gnome.Nautilus.desktop \
            org.gnome.Ptyxis.desktop \
            org.gnome.Papers.desktop \
            org.gnome.Loupe.desktop \
            org.gnome.TextEditor.desktop \
            org.gnome.Showtime.desktop \
            org.gnome.FileRoller.desktop; do
            test -r "/usr/share/applications/${desktop}"
          done
