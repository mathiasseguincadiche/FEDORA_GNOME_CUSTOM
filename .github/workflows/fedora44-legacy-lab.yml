name: Historical Fedora 44 GNOME boot and recovery lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Boot GNOME, reboot, recover VM and rebuild Fedora
        shell: bash
        env:
          FGC_LAB_RELEASE: '44'
          FGC_LAB_EXTENSION_MODE: curated
        run: timeout --signal=TERM --kill-after=60s 80m bash .github/scripts/fedora-gnome-vm.sh
      - name: Preserve pretest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-legacy-boot-recovery-${{ github.run_id }}
          path: |
            .fedora-gnome-lab/report.json
            .fedora-gnome-lab/evidence/
          if-no-files-found: error
          retention-days: 14
