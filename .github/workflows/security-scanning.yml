name: Security scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '24 8 * * 1'

permissions:
  contents: read

jobs:
  python-codeql:
    name: CodeQL Python
    # GitHub code scanning accepts results for same-repository PRs and main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4, pinned
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4, pinned
        with:
          category: /language:python

  secrets:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2, pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
