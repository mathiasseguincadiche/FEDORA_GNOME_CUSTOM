name: Fedora 45 GNOME 51 six-extension QEMU lab
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify independently pinned signed Fedora 45 Cloud seed
        run: python3 .github/scripts/fedora45-preview-media.py
      - name: Boot GNOME 51 with six active extensions, reboot and recover VM
        shell: bash
        env:
          FGC_LAB_RELEASE: '45'
          FGC_LAB_EXTENSION_MODE: curated
        run: timeout --signal=TERM --kill-after=60s 80m bash .github/scripts/fedora-gnome-vm.sh
      - name: Document strict boundaries
        if: always()
        run: |
          echo 'Candidate QEMU preview only. No Fedora 45 media promotion, production APPLY or hardware Gate 3.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The exact Fedora RPM candidates use explicit QEMU-only updates-testing. Production accepts stable repositories only; promotion refuses missing stable candidates. Shared lock, installer and runtime patch are verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain session and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora45-gnome51-six-extensions-${{ github.run_id }}
          path: |
            .fedora45-preview/signature.log
            .fedora45-preview/fedora45-cloud.lock
            .fedora-gnome-lab/report.json
            .fedora-gnome-lab/evidence/
          if-no-files-found: error
          retention-days: 14
