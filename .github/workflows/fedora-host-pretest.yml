name: Fedora 44 host integration pretest

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * 0'
  push:
    branches: [main]
    paths:
      - 'manifests/**'
      - 'config/repos/**'
      - 'config/desktop.conf'
      - 'config/gnome.conf'
      - 'config/shell.conf'
      - 'modules/system/**'
      - 'modules/hardware/**'
      - 'modules/gnome/**'
      - 'modules/desktop/**'
      - 'modules/applications/**'
      - 'modules/virtualization/**'
      - 'modules/backup/**'
      - 'diagnostics/**'
      - 'scripts/backup/**'
      - 'scripts/gnome/**'
      - 'scripts/kvm/**'
      - 'scripts/shell/**'
      - 'shell/**'
      - 'systemd/user/**'
      - '.github/workflows/fedora-host-pretest.yml'
  pull_request:
    paths:
      - 'manifests/**'
      - 'config/repos/**'
      - 'config/desktop.conf'
      - 'config/gnome.conf'
      - 'config/shell.conf'
      - 'modules/system/**'
      - 'modules/hardware/**'
      - 'modules/gnome/**'
      - 'modules/desktop/**'
      - 'modules/applications/**'
      - 'modules/virtualization/**'
      - 'modules/backup/**'
      - 'diagnostics/**'
      - 'scripts/backup/**'
      - 'scripts/gnome/**'
      - 'scripts/kvm/**'
      - 'scripts/shell/**'
      - 'shell/**'
      - 'systemd/user/**'
      - '.github/workflows/fedora-host-pretest.yml'

permissions:
  contents: read
concurrency:
  group: fedora-44-host-pretest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages-and-integration:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Fedora-native base contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(cat \
            manifests/packages-system.txt \
            manifests/packages-hardware.txt \
            manifests/packages-gnome.txt \
            manifests/packages-gnome-extensions.txt \
            manifests/packages-desktop-integration.txt \
            manifests/packages-shell.txt \
            manifests/packages-multimedia-fedora.txt \
            manifests/packages-applications-gtk4.txt \
            manifests/packages-applications-professional-fedora.txt \
            manifests/packages-virtualization.txt | sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' | sort -u)
          dnf -y install restic jq acl xorriso dbus-daemon "${packages[@]}"
          rpm -q restic jq acl xorriso gnome-shell nautilus xdg-desktop-portal-gnome xdg-user-dirs ptyxis qemu-kvm libvirt virt-install gnome-keyring cups tuned-ppd intel-compute-runtime bash-completion fzf zoxide direnv unzip
      - name: Validate Fedora host Bash UX
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m shelltest
          runuser -u shelltest -- env \
            HOME=/home/shelltest \
            XDG_CONFIG_HOME=/home/shelltest/.config \
            XDG_STATE_HOME=/home/shelltest/.local/state \
            FGC_SHELL_SOURCE_DIR="$GITHUB_WORKSPACE/shell/bash" \
            FGC_HISTSIZE=50000 \
            FGC_HISTFILESIZE=100000 \
            FGC_ENABLE_FZF=true \
            FGC_ENABLE_ZOXIDE=true \
            FGC_ENABLE_DIRENV=true \
            FGC_PROMPT_GIT=true \
            "$GITHUB_WORKSPACE/scripts/shell/install-host-bash-ux.sh"
          grep -Fxq '# >>> fedora-gnome-custom bash ux >>>' /home/shelltest/.bashrc
          test -r /home/shelltest/.local/state/fedora-gnome-custom/bash/bashrc.pre-fgc
          runuser -u shelltest -- env HOME=/home/shelltest XDG_CONFIG_HOME=/home/shelltest/.config bash --noprofile --rcfile /home/shelltest/.config/fedora-gnome-custom/bash/init.sh -ic \
            'declare -F __fgc_prompt_update >/dev/null && alias gs >/dev/null && command -v fzf >/dev/null && command -v zoxide >/dev/null && command -v direnv >/dev/null && type z >/dev/null'
      - name: Validate curated GNOME dock policy
        shell: bash
        run: |
          set -Eeuo pipefail
          favorites='org.gnome.Nautilus.desktop brave-browser.desktop org.gnome.Ptyxis.desktop code.desktop com.bitwarden.desktop.desktop com.slack.Slack.desktop libreoffice-startcenter.desktop org.gnome.Software.desktop'
          expected="['org.gnome.Nautilus.desktop', 'brave-browser.desktop', 'org.gnome.Ptyxis.desktop', 'code.desktop', 'com.bitwarden.desktop.desktop', 'com.slack.Slack.desktop', 'libreoffice-startcenter.desktop', 'org.gnome.Software.desktop']"
          useradd -m docktest
          runuser -u docktest -- env HOME=/home/docktest dbus-run-session -- "$GITHUB_WORKSPACE/scripts/gnome/configure-dock-favorites.sh" "$favorites"
          actual="$(runuser -u docktest -- env HOME=/home/docktest dbus-run-session -- gsettings get org.gnome.shell favorite-apps)"
          test "$actual" = "$expected"
          for desktop in org.gnome.Nautilus.desktop org.gnome.Ptyxis.desktop libreoffice-startcenter.desktop org.gnome.Software.desktop; do test -f "/usr/share/applications/$desktop"; done
      - name: Validate GNOME desktop ergonomics settings
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m ergotest
          runuser -u ergotest -- env HOME=/home/ergotest XDG_DATA_HOME=/home/ergotest/.local/share dbus-run-session -- bash -Eeuo pipefail -c '
            mkdir -p "$HOME/Bureau"
            xdg-user-dirs-update --set DESKTOP "$HOME/Bureau"

            bash "$GITHUB_WORKSPACE/scripts/gnome/install-ding.sh" \
              https://extensions.gnome.org/review/download/74408.shell-extension.zip \
              ding@rastersoft.com 50
            ding_schema_dir="$HOME/.local/share/gnome-shell/extensions/ding@rastersoft.com/schemas"
            ding_schema=org.gnome.shell.extensions.ding
            gsettings --schemadir "$ding_schema_dir" set "$ding_schema" show-trash true
            gsettings --schemadir "$ding_schema_dir" set "$ding_schema" show-home false
            gsettings --schemadir "$ding_schema_dir" set "$ding_schema" show-volumes false
            gsettings --schemadir "$ding_schema_dir" set "$ding_schema" show-network-volumes false

            bash "$GITHUB_WORKSPACE/scripts/gnome/install-show-desktop-plus.sh" \
              https://extensions.gnome.org/review/download/70326.shell-extension.zip \
              show-desktop-plus@attentivecoder 50
            schema_dir="$HOME/.local/share/gnome-shell/extensions/show-desktop-plus@attentivecoder/schemas"
            schema=org.gnome.shell.extensions.show-desktop-plus
            gsettings --schemadir "$schema_dir" set "$schema" button-position "'"'left-end'"'"
            gsettings --schemadir "$schema_dir" set "$schema" left-click-action "'"'toggle-desktop'"'"
            gsettings --schemadir "$schema_dir" set "$schema" middle-click-action "'"'hide-focused'"'"
            gsettings --schemadir "$schema_dir" set "$schema" current-monitor-only false
            gsettings --schemadir "$schema_dir" set "$schema" enable-hotkey true
            gsettings --schemadir "$schema_dir" set "$schema" show-desktop-hotkey "['"'<Super>d>'"']"
            gsettings --schemadir "$schema_dir" set "$schema" icon-style "'"'desktop'"'"
            gsettings --schemadir "$schema_dir" set "$schema" show-hidden-count false

            test "$(xdg-user-dir DESKTOP)" = "$HOME/Bureau"
            test "$(gsettings --schemadir "$ding_schema_dir" get "$ding_schema" show-trash)" = true
            test "$(gsettings --schemadir "$ding_schema_dir" get "$ding_schema" show-home)" = false
            test "$(gsettings --schemadir "$ding_schema_dir" get "$ding_schema" show-volumes)" = false
            test "$(gsettings --schemadir "$ding_schema_dir" get "$ding_schema" show-network-volumes)" = false
            grep -Fxq source_url=https://extensions.gnome.org/review/download/74408.shell-extension.zip "$HOME/.local/share/gnome-shell/extensions/ding@rastersoft.com/.fedora-gnome-custom-source"
            grep -Fxq review_id=74408 "$HOME/.local/share/gnome-shell/extensions/ding@rastersoft.com/.fedora-gnome-custom-source"
            grep -Fxq site_version=95 "$HOME/.local/share/gnome-shell/extensions/ding@rastersoft.com/.fedora-gnome-custom-source"

            test "$(gsettings --schemadir "$schema_dir" get "$schema" button-position)" = "'"'left-end'"'"
            test "$(gsettings --schemadir "$schema_dir" get "$schema" left-click-action)" = "'"'toggle-desktop'"'"
            test "$(gsettings --schemadir "$schema_dir" get "$schema" show-desktop-hotkey)" = "['"'<Super>d>'"']"
            test "$(gsettings --schemadir "$schema_dir" get "$schema" show-hidden-count)" = false
            grep -Fxq source_url=https://extensions.gnome.org/review/download/70326.shell-extension.zip "$HOME/.local/share/gnome-shell/extensions/show-desktop-plus@attentivecoder/.fedora-gnome-custom-source"
          '
      - name: Enable RPM Fusion
        run: dnf -y install "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm" "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm"
      - name: Validate multimedia provider convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf -y install ffmpeg-free libva-intel-media-driver
          dnf -y swap ffmpeg-free ffmpeg --allowerasing
          dnf -y swap libva-intel-media-driver intel-media-driver --allowerasing
          mapfile -t rpmfusion_packages < <(sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' manifests/packages-rpmfusion.txt)
          dnf -y install "${rpmfusion_packages[@]}"
          rpm -q ffmpeg intel-media-driver "${rpmfusion_packages[@]}"
      - name: Validate signed vendor RPM metadata
        run: |
          install -m 0644 config/repos/vscode.repo /etc/yum.repos.d/vscode.repo
          install -m 0644 config/repos/brave-browser.repo /etc/yum.repos.d/brave-browser.repo
          dnf -y makecache --refresh
          dnf -q --repo=code list --available code >/dev/null
          dnf -q --repo=brave-browser list --available brave-browser >/dev/null
      - name: Validate Flathub application IDs
        shell: bash
        run: |
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          while IFS= read -r app; do
            [[ -z "$app" || "$app" == \#* ]] && continue
            flatpak remote-info --system flathub "$app" >/dev/null
          done < manifests/flatpaks-applications-professional.txt
      - name: Validate GNOME 50 Fedora RPM extension payloads
        run: |
          test -d /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com
          test -d /usr/share/gnome-shell/extensions/blur-my-shell@aunetx
          test -d /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com/metadata.json
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/blur-my-shell@aunetx/metadata.json
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com/metadata.json
