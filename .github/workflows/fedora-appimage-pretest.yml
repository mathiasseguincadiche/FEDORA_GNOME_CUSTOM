name: Fedora 44 AppImage compatibility pretest

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 0'
  push:
    paths:
      - 'manifests/packages-appimage.txt'
      - 'manifests/flatpaks-appimage.txt'
      - 'modules/applications/43_appimage_compat.sh'
      - 'diagnostics/appimage-doctor'
      - 'scripts/appimage/**'
      - 'tests/test_appimage_contract.sh'
      - 'docs/APPIMAGE.md'
      - '.github/workflows/fedora-appimage-pretest.yml'
      - '.github/workflows/fedora-package-preflight.yml'
  pull_request:
    paths:
      - 'manifests/packages-appimage.txt'
      - 'manifests/flatpaks-appimage.txt'
      - 'modules/applications/43_appimage_compat.sh'
      - 'diagnostics/appimage-doctor'
      - 'scripts/appimage/**'
      - 'tests/test_appimage_contract.sh'
      - 'docs/APPIMAGE.md'
      - '.github/workflows/fedora-appimage-pretest.yml'
      - '.github/workflows/fedora-package-preflight.yml'

permissions:
  contents: read

concurrency:
  group: fedora-44-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage-compat:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve AppImage Fedora manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r pkg; do
            [[ -z "$pkg" || "$pkg" == \#* ]] && continue
            matches="$(dnf -q repoquery --available "$pkg")"
            [[ -n "$matches" ]] || { echo "UNRESOLVED APPIMAGE PACKAGE: $pkg"; exit 1; }
          done < manifests/packages-appimage.txt

      - name: Install AppImage compatibility payload
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' manifests/packages-appimage.txt)
          dnf -y install "${packages[@]}"
          install -Dm0755 scripts/appimage/appimage-run /usr/local/bin/appimage-run

      - name: Validate FUSE 2 and FUSE 3 multilib
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q fuse fuse-libs.x86_64 fuse-libs.i686 fuse3 fuse3-libs.x86_64 fuse3-libs.i686
          command -v fusermount >/dev/null
          command -v fusermount3 >/dev/null

      - name: Validate Type 1 and Type 2 extraction helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q bsdtar squashfs-tools file desktop-file-utils shared-mime-info xdg-utils
          command -v bsdtar >/dev/null
          command -v unsquashfs >/dev/null
          command -v desktop-file-validate >/dev/null
          command -v xdg-open >/dev/null

      - name: Validate AppImage type detection without executing payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '\177ELF\0\0\0\0AI\001' > /tmp/type1.AppImage
          printf '\177ELF\0\0\0\0AI\002' > /tmp/type2.AppImage
          test "$(appimage-run --identify /tmp/type1.AppImage)" = type1
          test "$(appimage-run --identify /tmp/type2.AppImage)" = type2

      - name: Validate Gear Lever availability on Flathub
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf -y install flatpak
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          while IFS= read -r app; do
            [[ -z "$app" || "$app" == \#* ]] && continue
            flatpak remote-info --system flathub "$app" >/dev/null || { echo "UNRESOLVED APPIMAGE FLATPAK: $app"; exit 1; }
          done < manifests/flatpaks-appimage.txt

      - name: Validate static AppImage contract
        shell: bash
        run: bash tests/test_appimage_contract.sh
