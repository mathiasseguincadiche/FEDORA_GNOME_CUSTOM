name: Rocky Linux 10.3 real VM pretest

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 7 * * 0'
permissions:
  contents: read
concurrency:
  group: rocky-103-vm-pretest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rocky-103-real-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run real Rocky Linux 10.3 VM + DevOps bootstrap
        run: .github/scripts/vm-pretest.sh
      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora-gnome-custom-rocky-vm-pretest-${{ github.run_id }}
          path: |
            .vm-pretest/report.txt
            .vm-pretest/host-apt.log
            .vm-pretest/console.log
            .vm-pretest/bootstrap.log
            .vm-pretest/verify.log
            .vm-pretest/guest-health.log
          if-no-files-found: warn
          retention-days: 14
