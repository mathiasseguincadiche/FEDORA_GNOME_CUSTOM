name: Rocky Linux 10.2 real VM pretest

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 7 * * 0'
permissions:
  contents: read
concurrency:
  group: rocky-102-vm-pretest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocky-102-real-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run real Rocky Linux 10.2 VM + DevOps bootstrap
        run: .github/scripts/vm-pretest.sh
      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-gnome-custom-rocky-vm-pretest-${{ github.run_id }}
          path: |
            .vm-pretest/report.txt
            .vm-pretest/console.log
            .vm-pretest/bootstrap.log
            .vm-pretest/verify.log
            .vm-pretest/guest-health.log
          if-no-files-found: warn
          retention-days: 14
