name: Fedora 45 N+1 qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 3'
  push:
    branches: [main]
    paths:
      - 'config/fedora-upgrade.policy'
      - 'scripts/upgrade/**'
      - 'scripts/gnome/**'
      - 'manifests/**'
      - 'config/repos/**'
      - '.github/workflows/fedora45-qualification.yml'
      - 'tests/test_fedora_upgrade_lifecycle_contract.sh'
  pull_request:
    paths:
      - 'config/fedora-upgrade.policy'
      - 'scripts/upgrade/**'
      - 'scripts/gnome/**'
      - 'manifests/**'
      - 'config/repos/**'
      - '.github/workflows/fedora45-qualification.yml'
      - 'tests/test_fedora_upgrade_lifecycle_contract.sh'

permissions:
  contents: read

jobs:
  fedora45-qualification:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fedora 45 / GNOME 51 readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Eq '^VERSION_ID="?45"?$' /etc/os-release
          dnf -y install dnf5-plugins curl jq gnome-shell nautilus ptyxis restic qemu-kvm libvirt mesa-dri-drivers mesa-vulkan-drivers flatpak
          shell_major="$(rpm -q --qf '%{VERSION}' gnome-shell | cut -d. -f1)"
          test "$shell_major" -ge 51
          dnf5 repoclosure --help >/dev/null
          dnf5 repoquery --duplicates >/tmp/f45-duplicates.txt || true
          dnf5 repoquery --extras >/tmp/f45-extras.txt || true
          dnf5 repoclosure --json >/tmp/f45-repoclosure.json
          rpm -q gnome-shell nautilus ptyxis restic qemu-kvm libvirt mesa-dri-drivers mesa-vulkan-drivers flatpak

      - name: Build Fedora 45 qualification report
        shell: bash
        run: |
          set -Eeuo pipefail
          report=fedora45-qualification-report.txt
          blockers=0
          {
            printf 'Fedora 45 N+1 qualification report\n'
            printf 'generated_utc=%s\n' "$(date -u +%FT%TZ)"
            printf 'project_sha=%s\n' "$GITHUB_SHA"
            printf 'fedora_release=45\n'
            printf 'gnome_shell=%s\n' "$(rpm -q --qf '%{VERSION}-%{RELEASE}' gnome-shell)"
            printf '\n[duplicates]\n'
            cat /tmp/f45-duplicates.txt
            printf '\n[extras]\n'
            cat /tmp/f45-extras.txt
            printf '\n[repository-closure]\n'
            cat /tmp/f45-repoclosure.json
            printf '\n[golden-extension-compatibility]\n'
          } > "$report"

          if grep -Eq 'shell_version=.*50|GNOME Shell target.*50' scripts/gnome/install-*.sh; then
            printf 'BLOCKER: reviewed Golden extension artifacts remain pinned to GNOME Shell 50.\n' >> "$report"
            blockers=$((blockers+1))
          fi

          final_url='https://download.fedoraproject.org/pub/fedora/linux/releases/45/'
          if curl -fsSL --connect-timeout 10 --max-time 30 -o /dev/null "$final_url"; then
            printf 'final_release=published\n' >> "$report"
          else
            printf 'BLOCKER: Fedora 45 final release is not published at the configured release URL.\n' >> "$report"
            blockers=$((blockers+1))
          fi

          if (( blockers == 0 )); then
            printf 'verdict=READY_FOR_HOST_QUALIFICATION\n' >> "$report"
          else
            printf 'verdict=BLOCKED\nblockers=%d\n' "$blockers" >> "$report"
          fi

          cat "$report"
          test -s "$report"

      - name: Validate static Fedora upgrade contract
        run: bash tests/test_fedora_upgrade_lifecycle_contract.sh

      - name: Upload Fedora 45 qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora45-qualification-${{ github.run_id }}
          path: fedora45-qualification-report.txt
          if-no-files-found: warn
