name: Gtk4 DING v148 experimental QEMU qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/gtk4-ding-v148.lab.lock'
      - '.github/workflows/gtk4-ding-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate Fedora 45 Cloud seed
        run: python3 .github/scripts/fedora45-preview-media.py
      - name: Exercise upstream Gtk4 DING v148 without the v145 patch
        shell: bash
        env:
          FGC_LAB_RELEASE: '45'
          FGC_LAB_EXTENSION_MODE: curated
          FGC_LAB_DING_VARIANT: gtk4-v148
        run: timeout --signal=TERM --kill-after=60s 80m bash .github/scripts/fedora-gnome-vm.sh
      - name: Retain experimental session evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtk4-ding-v148-experimental-${{ github.run_id }}
          path: |
            .fedora-gnome-lab/report.json
            .fedora-gnome-lab/evidence/
          if-no-files-found: error
          retention-days: 14
