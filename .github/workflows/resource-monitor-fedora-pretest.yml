name: Fedora 45 Vitals telemetry pretest

on:
  push:
    branches: [main]
    paths:
      - 'config/gnome.conf'
      - 'config/gnome-extensions.lock'
      - 'scripts/gnome/install-pinned-extension.sh'
      - 'scripts/gnome/validate-extension-metadata.py'
      - 'modules/gnome/24b_resource_monitor.sh'
      - 'scripts/gnome/install-resource-monitor.sh'
      - 'diagnostics/resource-monitor-doctor'
      - 'tests/test_resource_monitor_contract.sh'
      - '.github/workflows/resource-monitor-fedora-pretest.yml'
  pull_request:
    paths:
      - 'config/gnome.conf'
      - 'config/gnome-extensions.lock'
      - 'scripts/gnome/install-pinned-extension.sh'
      - 'scripts/gnome/validate-extension-metadata.py'
      - 'modules/gnome/24b_resource_monitor.sh'
      - 'scripts/gnome/install-resource-monitor.sh'
      - 'diagnostics/resource-monitor-doctor'
      - 'tests/test_resource_monitor_contract.sh'
      - '.github/workflows/resource-monitor-fedora-pretest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-profile:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install GNOME 51 telemetry test dependencies
        run: dnf -y --refresh install gnome-shell curl unzip glib2 python3 dbus-daemon xdg-user-dirs
      - name: Validate reviewed GNOME 51 Vitals settings
        run: bash .github/scripts/gnome51-settings-pretest.sh
