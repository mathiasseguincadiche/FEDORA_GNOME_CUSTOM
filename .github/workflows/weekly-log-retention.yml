name: Weekly log retention tests
on:
  push:
    paths:
      - 'scripts/maintenance/weekly-log-cleanup.py'
      - 'tests/test_weekly_log_cleanup.py'
      - 'scripts/maintenance/log_explanations.py'
      - '.github/workflows/weekly-log-retention.yml'
  pull_request:
    paths:
      - 'scripts/maintenance/weekly-log-cleanup.py'
      - 'tests/test_weekly_log_cleanup.py'
      - '.github/workflows/weekly-log-retention.yml'
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test conservative weekly retention
        run: python3 -m unittest discover -s tests -p 'test_weekly_log_cleanup.py' -v
