name: Weekly log retention tests
on:
  push:
    paths:
      - 'scripts/maintenance/weekly-log-cleanup.py'
      - 'scripts/maintenance/prune-project-artifacts.sh'
      - 'scripts/maintenance/install-weekly-log-cleanup.sh'
      - 'systemd/user/fgc-weekly-log-cleanup.service'
      - 'config/operator-retention.policy'
      - 'tests/test_weekly_log_cleanup.py'
      - 'tests/test_operator_retention_behavior.sh'
      - 'scripts/maintenance/log_explanations.py'
      - '.github/workflows/weekly-log-retention.yml'
  pull_request:
    paths:
      - 'scripts/maintenance/weekly-log-cleanup.py'
      - 'scripts/maintenance/prune-project-artifacts.sh'
      - 'scripts/maintenance/install-weekly-log-cleanup.sh'
      - 'systemd/user/fgc-weekly-log-cleanup.service'
      - 'config/operator-retention.policy'
      - 'tests/test_weekly_log_cleanup.py'
      - 'tests/test_operator_retention_behavior.sh'
      - '.github/workflows/weekly-log-retention.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test conservative weekly retention
        run: python3 -m unittest discover -s tests -p 'test_weekly_log_cleanup.py' -v
      - name: Test manual retention and incident preservation
        run: bash tests/test_operator_retention_behavior.sh
