name: Shell quality
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install ShellCheck from Ubuntu archive
        shell: bash
        run: |
          set -Eeuo pipefail
          sources=/etc/apt/sources.list.d/ubuntu.sources
          [[ -r "$sources" ]]
          apt_opts=(
            -o "Dir::Etc::sourcelist=$sources"
            -o "Dir::Etc::sourceparts=-"
            -o APT::Get::List-Cleanup=0
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Retries=3
          )
          timeout 600 sudo apt-get "${apt_opts[@]}" update
          timeout 600 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Bash syntax
        shell: bash
        run: |
          git ls-files '*.sh' 'diagnostics/*' 'scripts/systemd/*' 'virtualization/networkmanager/*' | while IFS= read -r file; do bash -n "$file"; done
      - name: ShellCheck
        shell: bash
        run: |
          # Modules are intentionally sourced by the orchestrator, so externally
          # injected config variables use the narrow SC2154 exception. Unused and
          # misspelled local variables remain visible to ShellCheck.
          : > shellcheck.log
          rc=0
          while IFS= read -r file; do
            if ! shellcheck -x -e SC1090,SC1091,SC2154 "$file" >>shellcheck.log 2>&1; then
              rc=1
            fi
          done < <(git ls-files '*.sh' 'diagnostics/*' 'scripts/systemd/*' 'virtualization/networkmanager/*')
          cat shellcheck.log
          exit "$rc"
      - name: Upload ShellCheck failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shellcheck-failure-${{ github.run_id }}
          path: shellcheck.log
          if-no-files-found: warn
          retention-days: 7
