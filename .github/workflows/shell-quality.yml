name: Shell quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        shell: bash
        run: |
          git ls-files '*.sh' 'diagnostics/*' 'scripts/systemd/*' 'virtualization/networkmanager/*' | while IFS= read -r file; do bash -n "$file"; done
      - name: ShellCheck
        shell: bash
        run: |
          # Modules are intentionally sourced by the orchestrator, so externally
          # injected config variables use the narrow SC2154 exception. Unused and
          # misspelled local variables remain visible to ShellCheck.
          git ls-files '*.sh' 'diagnostics/*' 'scripts/systemd/*' 'virtualization/networkmanager/*' | while IFS= read -r file; do
            shellcheck -x -e SC1090,SC1091,SC2154 "$file"
          done
