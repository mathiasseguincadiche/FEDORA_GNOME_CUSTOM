name: Shell quality
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: find . -type f -name '*.sh' -o -path './diagnostics/*' | xargs -r bash -n
      - name: ShellCheck
        run: find . -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -e SC1090,SC1091
