name: Shell quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck from Ubuntu archive
        shell: bash
        run: |
          set -Eeuo pipefail
          sources=/etc/apt/sources.list.d/ubuntu.sources
          [[ -r "$sources" ]]
          apt_opts=(
            -o "Dir::Etc::sourcelist=$sources"
            -o "Dir::Etc::sourceparts=-"
            -o APT::Get::List-Cleanup=0
          )
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Bash syntax
        shell: bash
        run: |
          git ls-files '*.sh' 'diagnostics/*' 'scripts/systemd/*' 'virtualization/networkmanager/*' | while IFS= read -r file; do bash -n "$file"; done
      - name: ShellCheck
        shell: bash
        run: |
          # Modules are intentionally sourced by the orchestrator, so externally
          # injected config variables use the narrow SC2154 exception. Unused and
          # misspelled local variables remain visible to ShellCheck.
          : > shellcheck.log
          rc=0
          while IFS= read -r file; do
            if ! shellcheck -x -e SC1090,SC1091,SC2154 "$file" >>shellcheck.log 2>&1; then
              rc=1
            fi
          done < <(git ls-files '*.sh' 'diagnostics/*' 'scripts/systemd/*' 'virtualization/networkmanager/*')
          cat shellcheck.log
          exit "$rc"
      - name: Upload ShellCheck failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shellcheck-failure-${{ github.run_id }}
          path: shellcheck.log
          if-no-files-found: warn
          retention-days: 7
