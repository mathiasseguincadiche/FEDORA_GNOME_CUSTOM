name: Fedora 44 package preflight
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 0'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    container: public.ecr.aws/docker/library/fedora:44
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable RPM Fusion metadata
        shell: bash
        run: bash scripts/ci/enable-rpmfusion.sh
      - name: Resolve Fedora manifests
        shell: bash
        run: |
          set -euo pipefail
          for manifest in manifests/packages-system.txt manifests/packages-hardware.txt manifests/packages-gnome.txt manifests/packages-nautilus.txt manifests/packages-nautilus-optional.txt manifests/packages-gnome-extensions.txt manifests/packages-desktop-integration.txt manifests/packages-performance.txt manifests/packages-shell.txt manifests/packages-remote-fedora.txt manifests/packages-multimedia-fedora.txt manifests/packages-applications-gtk4.txt manifests/packages-applications-professional-fedora.txt manifests/packages-appimage.txt manifests/packages-virtualization.txt manifests/packages-rpmfusion.txt; do
            echo "== $manifest =="
            while IFS= read -r pkg; do
              [[ -z "$pkg" || "$pkg" == \#* ]] && continue
              dnf -q repoquery --available "$pkg" | grep -q . || { echo "UNRESOLVED: $pkg"; exit 1; }
            done < "$manifest"
          done
          for pkg in ffmpeg intel-media-driver; do
            dnf -q repoquery --available "$pkg" | grep -q . || { echo "UNRESOLVED PROVIDER: $pkg"; exit 1; }
          done
      - name: Verify professional vendor RPM repositories
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 config/repos/vscode.repo /etc/yum.repos.d/vscode.repo
          install -m 0644 config/repos/brave-browser.repo /etc/yum.repos.d/brave-browser.repo
          dnf -y makecache --refresh
          dnf -q --repo=code list --available code >/dev/null
          dnf -q --repo=brave-browser list --available brave-browser >/dev/null
      - name: Verify professional and AppImage Flathub applications
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install flatpak
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          for manifest in manifests/flatpaks-applications-professional.txt manifests/flatpaks-appimage.txt; do
            while IFS= read -r app; do
              [[ -z "$app" || "$app" == \#* ]] && continue
              flatpak remote-info --system flathub "$app" >/dev/null || { echo "UNRESOLVED FLATPAK: $app"; exit 1; }
            done < "$manifest"
          done
      - name: Validate multimedia provider swaps
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install ffmpeg-free libva-intel-media-driver
          dnf -y swap ffmpeg-free ffmpeg --allowerasing
          rpm -q ffmpeg
          ! rpm -q ffmpeg-free
          dnf -y swap libva-intel-media-driver intel-media-driver --allowerasing
          rpm -q intel-media-driver
      - name: Verify GTK4 libadwaita application contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            [[ -z "$pkg" || "$pkg" == \#* ]] && continue
            requirements="$(dnf -q repoquery --requires "$pkg")"
            grep -Eqi 'gtk4|libgtk-4\.so\.1' <<<"$requirements" || { echo "GTK4 REQUIREMENT MISSING: $pkg"; exit 1; }
            grep -Eqi 'libadwaita|libadwaita-1\.so\.0' <<<"$requirements" || { echo "LIBADWAITA REQUIREMENT MISSING: $pkg"; exit 1; }
          done < manifests/packages-applications-gtk4.txt
      - name: Verify Fedora GNOME 50 extension packages
        run: |
          set -euo pipefail
          dnf -y install gnome-shell-extension-dash-to-dock gnome-shell-extension-blur-my-shell gnome-shell-extension-appindicator
          rpm -q gnome-shell-extension-dash-to-dock gnome-shell-extension-blur-my-shell gnome-shell-extension-appindicator
          test -d /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com
          test -d /usr/share/gnome-shell/extensions/blur-my-shell@aunetx
          test -d /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com/metadata.json
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/blur-my-shell@aunetx/metadata.json
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com/metadata.json
      - name: Verify reviewed extension artifacts from the canonical lock
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf -y install curl unzip glib2 python3
          source config/gnome-extensions.lock
          for prefix in DING SHOW_DESKTOP_PLUS RESOURCE_MONITOR TILING_ASSISTANT; do
            url_key="${prefix}_SOURCE_URL"; sha_key="${prefix}_SHA256"
            uuid_key="${prefix}_UUID"; shell_key="${prefix}_SHELL_VERSION"
            dir="$(mktemp -d)"
            curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "${!url_key}" --output "$dir/extension.zip"
            printf '%s  %s\n' "${!sha_key}" "$dir/extension.zip" | sha256sum --check --status
            unzip -p "$dir/extension.zip" metadata.json > "$dir/metadata.json"
            python3 scripts/gnome/validate-extension-metadata.py "$dir/metadata.json" "${!uuid_key}" "${!shell_key}"
            unzip -q "$dir/extension.zip" -d "$dir/extension"
            glib-compile-schemas "$dir/extension/schemas"
          done
