name: Fedora 44 package preflight
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 0'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable RPM Fusion metadata
        run: |
          dnf -y install "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm" "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm"
      - name: Resolve Fedora manifests
        shell: bash
        run: |
          set -euo pipefail
          for manifest in manifests/packages-system.txt manifests/packages-hardware.txt manifests/packages-gnome.txt manifests/packages-nautilus.txt manifests/packages-nautilus-optional.txt manifests/packages-gnome-extensions.txt manifests/packages-desktop-integration.txt manifests/packages-shell.txt manifests/packages-multimedia-fedora.txt manifests/packages-applications-gtk4.txt manifests/packages-applications-professional-fedora.txt manifests/packages-virtualization.txt manifests/packages-rpmfusion.txt; do
            echo "== $manifest =="
            while IFS= read -r pkg; do
              [[ -z "$pkg" || "$pkg" == \#* ]] && continue
              dnf -q repoquery --available "$pkg" | grep -q . || { echo "UNRESOLVED: $pkg"; exit 1; }
            done < "$manifest"
          done
          for pkg in ffmpeg intel-media-driver; do
            dnf -q repoquery --available "$pkg" | grep -q . || { echo "UNRESOLVED PROVIDER: $pkg"; exit 1; }
          done
      - name: Verify professional vendor RPM repositories
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 config/repos/vscode.repo /etc/yum.repos.d/vscode.repo
          install -m 0644 config/repos/brave-browser.repo /etc/yum.repos.d/brave-browser.repo
          dnf -y makecache --refresh
          dnf -q --repo=code list --available code >/dev/null || { echo 'UNRESOLVED VENDOR APP: code'; exit 1; }
          dnf -q --repo=brave-browser list --available brave-browser >/dev/null || { echo 'UNRESOLVED VENDOR APP: brave-browser'; exit 1; }
      - name: Verify professional Flathub applications
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install flatpak
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          while IFS= read -r app; do
            [[ -z "$app" || "$app" == \#* ]] && continue
            flatpak remote-info --system flathub "$app" >/dev/null || { echo "UNRESOLVED FLATPAK: $app"; exit 1; }
          done < manifests/flatpaks-applications-professional.txt
      - name: Validate multimedia provider swaps
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install ffmpeg-free libva-intel-media-driver
          dnf -y swap ffmpeg-free ffmpeg --allowerasing
          rpm -q ffmpeg
          ! rpm -q ffmpeg-free
          dnf -y swap libva-intel-media-driver intel-media-driver --allowerasing
          rpm -q intel-media-driver
      - name: Verify GTK4 libadwaita application contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            [[ -z "$pkg" || "$pkg" == \#* ]] && continue
            requirements="$(dnf -q repoquery --requires "$pkg")"
            grep -Eqi 'gtk4|libgtk-4\.so\.1' <<<"$requirements" || { echo "GTK4 REQUIREMENT MISSING: $pkg"; exit 1; }
            grep -Eqi 'libadwaita|libadwaita-1\.so\.0' <<<"$requirements" || { echo "LIBADWAITA REQUIREMENT MISSING: $pkg"; exit 1; }
          done < manifests/packages-applications-gtk4.txt
      - name: Verify Fedora GNOME 50 extension packages
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install gnome-shell-extension-dash-to-dock gnome-shell-extension-blur-my-shell gnome-shell-extension-appindicator
          rpm -q gnome-shell-extension-dash-to-dock gnome-shell-extension-blur-my-shell gnome-shell-extension-appindicator
          test -d /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com
          test -d /usr/share/gnome-shell/extensions/blur-my-shell@aunetx
          test -d /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com/metadata.json
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/blur-my-shell@aunetx/metadata.json
          grep -Eq '"50"|50' /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com/metadata.json
      - name: Verify GNOME-reviewed DING artifact
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install curl unzip glib2
          zip=/tmp/ding-v95.zip
          dir=/tmp/ding-v95
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://extensions.gnome.org/review/download/74408.shell-extension.zip \
            --output "$zip"
          unzip -p "$zip" metadata.json > /tmp/ding-metadata.json
          grep -Fq '"uuid": "ding@rastersoft.com"' /tmp/ding-metadata.json
          grep -Eq '"50"|50' /tmp/ding-metadata.json
          mkdir -p "$dir"
          unzip -q "$zip" -d "$dir"
          test -r "$dir/schemas/org.gnome.shell.extensions.ding.gschema.xml"
          glib-compile-schemas "$dir/schemas"
      - name: Verify GNOME-reviewed Show Desktop Plus artifact
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install curl unzip glib2
          zip=/tmp/show-desktop-plus-v8.zip
          dir=/tmp/show-desktop-plus-v8
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://extensions.gnome.org/review/download/70326.shell-extension.zip \
            --output "$zip"
          unzip -p "$zip" metadata.json > /tmp/show-desktop-plus-metadata.json
          grep -Fq '"uuid": "show-desktop-plus@attentivecoder"' /tmp/show-desktop-plus-metadata.json
          grep -Eq '"50"|50' /tmp/show-desktop-plus-metadata.json
          mkdir -p "$dir"
          unzip -q "$zip" -d "$dir"
          test -r "$dir/schemas/org.gnome.shell.extensions.show-desktop-plus.gschema.xml"
          glib-compile-schemas "$dir/schemas"
      - name: Verify GNOME-reviewed Resource Monitor artifact
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install curl unzip glib2
          zip=/tmp/resource-monitor-v28.zip
          dir=/tmp/resource-monitor-v28
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://extensions.gnome.org/review/download/70909.shell-extension.zip \
            --output "$zip"
          unzip -p "$zip" metadata.json > /tmp/resource-monitor-metadata.json
          grep -Fq '"uuid": "Resource_Monitor@Ory0n"' /tmp/resource-monitor-metadata.json
          grep -Eq '"50"|50' /tmp/resource-monitor-metadata.json
          mkdir -p "$dir"
          unzip -q "$zip" -d "$dir"
          test -r "$dir/schemas/org.gnome.shell.extensions.resource-monitor.gschema.xml"
          grep -Fq 'gpu_busy_percent' "$dir/services/runtime.js"
          grep -Fq 'gt_busy_percent' "$dir/services/runtime.js"
          grep -Fq '0x8086' "$dir/services/runtime.js"
          glib-compile-schemas "$dir/schemas"
