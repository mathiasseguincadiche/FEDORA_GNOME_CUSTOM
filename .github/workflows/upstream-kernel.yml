name: Official upstream Linux RPM preflight
on:
  workflow_call:
    inputs:
      fedora_release:
        description: Fedora release of the disposable container
        type: string
        default: '44'
  workflow_dispatch:
    inputs:
      fedora_release:
        description: Fedora release of the disposable container
        type: string
        default: '44'
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ inputs.fedora_release || '44' }}
    timeout-minutes: 20
    steps:
      - name: Install disposable preflight dependencies
        run: dnf5 -y install git python3 dnf5-plugins sudo
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve exact official upstream packages and exercise the DNF lock
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf5 -y copr enable @kernel-vanilla/stable
          REPO_ROOT="$GITHUB_WORKSPACE"
          source lib/bootstrap.sh
          engine_bootstrap
          source lib/kernel_lifecycle.sh
          mkdir -p upstream-evidence
          if ! target="$(kernel_lifecycle_resolve_latest_stable 2>upstream-evidence/resolution.log)"; then
            cat upstream-evidence/resolution.log >&2
            echo "::error::Kernel target could not be verified against kernel.org and COPR; RPM download was not attempted."
            exit 40
          fi
          mapfile -t packages < <(kernel_lifecycle_latest_nevras "$target")
          (( ${#packages[@]} >= 5 ))
          kernel_lifecycle_pin_target "$target"
          dnf5 versionlock list
          # Resolve/download a genuine pinned transaction in this disposable
          # container; no production APPLY, kernel boot or hardware claim.
          # COPR mirrors can briefly publish metadata before every RPM is reachable.
          # Retry the exact pinned transaction; never weaken the lock or skip packages.
          downloaded=false
          for attempt in 1 2 3 4; do
            if dnf5 -y --setopt=allow_vendor_change=1 --setopt=timeout=30 --setopt=retries=5 install --downloadonly "${packages[@]}"; then
              downloaded=true
              break
            fi
            if (( attempt < 4 )); then
              echo "::warning::Pinned kernel RPM download failed (attempt $attempt/4); refreshing COPR metadata before retry"
              sleep $(( attempt * 10 ))
              dnf5 -y makecache --refresh || true
            fi
          done
          if [[ "$downloaded" != true ]]; then
            echo "::error::Pinned kernel RPMs unavailable after four attempts; failing closed"
            exit 1
          fi
          mkdir -p upstream-evidence
          printf 'target=%s\ncommit=%s\nscope=RPM preflight; kernel boot and hardware DEFERRED\n' "$target" "$(git rev-parse HEAD)" > upstream-evidence/target.env
          cp /etc/dnf/versionlock.toml upstream-evidence/
          printf '%s\n' "${packages[@]}" > upstream-evidence/packages.txt
          cat upstream-evidence/target.env >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve upstream RPM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-linux-rpm-${{ github.run_id }}
          path: upstream-evidence/
          if-no-files-found: warn
          retention-days: 14
