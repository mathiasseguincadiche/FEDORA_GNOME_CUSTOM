name: GNOME artifact digest bootstrap

on:
  push:
    branches: [hardening/0.14.0-final-rc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/0.14.0-final-rc
      - name: Calculate reviewed GNOME artifact SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          : > .github/gnome-artifact-digests.txt
          for id in 74408 70326 70909; do
            file="${id}.shell-extension.zip"
            curl --fail --location --proto '=https' --tlsv1.2 \
              "https://extensions.gnome.org/review/download/${file}" \
              --output "$file"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s %s\n' "$id" "$digest" >> .github/gnome-artifact-digests.txt
          done
      - name: Publish temporary digest proof on hardening branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- .github/gnome-artifact-digests.txt && git ls-files --error-unmatch .github/gnome-artifact-digests.txt >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/gnome-artifact-digests.txt
          git commit -m 'ci: record temporary GNOME artifact digests [skip ci]'
          git push origin HEAD:hardening/0.14.0-final-rc
